<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeteoCore — 3D Tiles viewer</title>
<!-- No CDN tag here: viewer.js inserts CesiumJS and its stylesheet (#1137).
     A parser-blocking script or render-blocking stylesheet from a host that
     silently drops packets would hold the whole page blank until the
     connection gives up. -->
<style>
  /* Dark under everything, so a page whose 3D view never starts is not white. */
  html, body { background: #05070b; color: #e8eef6; }
  html, body, #cesium { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  #cesium { position: absolute; inset: 0; }
  #cesium[hidden] { display: none; }
  #bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    padding: 9px 14px; box-sizing: border-box;
    background: rgba(10, 13, 20, 0.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    color: #e8eef6; font: 13px/1.3 system-ui, -apple-system, sans-serif;
  }
  #bar .brand { font-weight: 650; letter-spacing: .2px; margin-right: 4px; white-space: nowrap; }
  #bar .brand span { opacity: .55; font-weight: 400; }
  #fields { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; min-width: 0; }
  #bar .field { display: flex; align-items: center; gap: 6px; min-width: 0; }
  /* `[hidden]` alone loses to the rule above on specificity — force it. */
  #bar .field[hidden] { display: none; }
  #bar label { opacity: .6; white-space: nowrap; }
  #bar select, #bar input {
    background: #161b25; color: #e8eef6; border: 1px solid #2a3340;
    border-radius: 6px; padding: 5px 8px; font: 13px system-ui; max-width: 320px; min-width: 0;
  }
  #bar input[type=number] { width: 64px; }
  #bar input[type=text] { width: 96px; }
  #menu {
    display: none; background: #1b2230; color: #e8eef6; border: 1px solid #2a3340; border-radius: 6px;
    width: 34px; height: 30px; font-size: 16px; line-height: 1; cursor: pointer;
  }
  /* Fills what the fields leave, and ellipsizes there rather than wrapping
     onto a second row (the full text is its tooltip). */
  #status {
    flex: 1 1 0; min-width: 120px; text-align: right; opacity: .6; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.err { color: #ff8a8a; opacity: .95; }
  /* Phone: the fields fold into a menu so the bar stays one row. */
  @media (max-width: 760px) {
    #menu { display: block; order: 2; }
    #bar .brand { order: 1; }
    #status { order: 3; min-width: 0; }
    #fields { order: 4; display: none; flex: 1 1 100%; flex-direction: column; align-items: stretch; gap: 8px; padding: 4px 0 2px; }
    #bar.open #fields { display: flex; }
    #bar .field { justify-content: space-between; }
    #bar select { flex: 1 1 auto; max-width: 70vw; }
  }
  /* When the 3D view cannot start: what happened, and where the data is. */
  #fallback {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%); z-index: 9;
    width: min(620px, calc(100vw - 24px)); max-height: calc(100vh - 88px); overflow: auto;
    box-sizing: border-box; padding: 16px 18px; border-radius: 10px;
    background: rgba(16, 21, 31, 0.96); border: 1px solid rgba(255, 255, 255, 0.1);
    font: 14px/1.45 system-ui, -apple-system, sans-serif;
  }
  #fallback[hidden] { display: none; }
  #fallback h2 { margin: 0 0 6px; font-size: 17px; color: #ffb4a8; }
  #fallback p { margin: 0 0 10px; opacity: .85; }
  #fallback ul { list-style: none; margin: 0 0 12px; padding: 0; }
  #fallback li { padding: 7px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); }
  #fallback li .fname { display: block; font-weight: 600; }
  #fallback li a { margin-right: 14px; font-size: 13px; }
  #fallback a { color: #8cc4ff; }
  /* Colour-scale legend for the point cloud (value → colour). */
  #legend {
    position: absolute; left: 14px; bottom: 34px; z-index: 10;
    padding: 8px 10px; border-radius: 8px;
    background: rgba(10, 13, 20, 0.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #e8eef6; font: 11px/1.2 system-ui, -apple-system, sans-serif;
  }
  #legend[hidden] { display: none; }
  #legend .ltitle { opacity: .7; margin-bottom: 6px; font-size: 11px; max-width: 128px; }
  #legend .lwrap { display: flex; height: 132px; }
  #legend .lbar { width: 13px; height: 100%; border: 1px solid rgba(255,255,255,.18); border-radius: 2px; }
  #legend .lticks { position: relative; width: 36px; margin-left: 5px; }
  #legend .tick { position: absolute; left: 0; transform: translateY(50%); white-space: nowrap; opacity: .85; }
  #legend .tick::before { content: "– "; opacity: .5; }
  /* Time scrubber (shown only when the collection has >1 volume). */
  #timebar {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 10;
    display: flex; align-items: center; gap: 10px; box-sizing: border-box;
    padding: 8px 14px; border-radius: 9px; max-width: calc(100vw - 24px);
    background: rgba(10, 13, 20, 0.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: #e8eef6; font: 12px system-ui, -apple-system, sans-serif;
  }
  #timebar[hidden] { display: none; }
  #timebar button {
    flex: none; background: #1b2230; color: #e8eef6; border: 1px solid #2a3340; border-radius: 6px;
    width: 30px; height: 26px; cursor: pointer; font-size: 13px; line-height: 1;
  }
  #timebar button:hover { background: #232c3c; }
  #timebar input[type=range] { width: 320px; min-width: 40px; flex: 0 1 auto; accent-color: #4a90d9; }
  #timeLabel, #timeCount { opacity: .85; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #timeLabel { min-width: 104px; }
  /* Phone: the time bar spans the width above CesiumJS's credit line (the
     basemap attribution stays readable), the legend above it. */
  @media (max-width: 480px) {
    #timebar { left: 12px; right: 12px; transform: none; bottom: 36px; padding: 7px 10px; gap: 8px; }
    #timebar input[type=range] { width: auto; flex: 1 1 auto; }
    #timeCount { display: none; }
    #legend { left: 12px; bottom: 88px; }
    #legend .lwrap { height: 104px; }
  }
</style>
</head>
<body>
<div id="bar">
  <div class="brand">MeteoCore <span>· 3D Tiles</span></div>
  <button id="menu" type="button" aria-expanded="false" aria-controls="fields" title="Controls">☰</button>
  <div id="fields">
    <div class="field"><label for="coll">Collection</label><select id="coll"></select></div>
    <div class="field"><label for="qty">Quantity</label><select id="qty"></select></div>
    <div class="field"><label for="rep">View</label><select id="rep"></select></div>
    <div class="field" id="resField" hidden><label for="res">Resolution</label><select id="res">
      <option value="low">Low</option>
      <option value="med" selected>Med</option>
      <option value="high">High</option>
    </select></div>
    <div class="field"><label id="numLabel" for="num">min dBZ</label><input id="num" type="number" value="5" step="any"></div>
  </div>
  <div id="status" role="status"></div>
</div>
<div id="cesium"></div>
<div id="fallback" hidden>
  <h2 id="fallbackTitle"></h2>
  <p id="fallbackText"></p>
  <ul id="fallbackList"></ul>
  <p><a id="retry" href="">Try again</a></p>
</div>
<div id="legend" hidden>
  <div class="ltitle"></div>
  <div class="lwrap"><div class="lbar"></div><div class="lticks"></div></div>
</div>
<div id="timebar" hidden>
  <button id="play" type="button" title="Play / pause">▶</button>
  <input id="time" type="range" min="0" max="0" step="1" value="0" aria-label="Volume time">
  <span id="timeLabel"></span><span id="timeCount"></span>
</div>
<script src="viewer.js"></script>
</body>
</html>
