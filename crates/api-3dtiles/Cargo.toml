[package]
name = "api-3dtiles"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"

[dependencies]
ds-core = { path = "../core" }
ds-3dtiles = { path = "../ds-3dtiles" }
ds-render = { path = "../render" }
arc-swap = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
ds-cache = { path = "../ds-cache" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"

[dev-dependencies]
tower = "0.5"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1"
