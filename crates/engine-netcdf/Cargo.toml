[package]
name = "engine-netcdf"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "CF-NetCDF gridded forecast engine (local, HTTP-range or OPeNDAP NetCDF files -> WMS/Maps/Tiles)"

[dependencies]
ds-core = { path = "../core" }
ds-cache = { path = "../ds-cache" }
ds-executor = { path = "../ds-executor" }
ds-poll = { path = "../ds-poll" }
ds-storage = { path = "../storage" }
arc-swap = "1"
chrono = { version = "0.4", features = ["serde"] }
hdf5-reader = { version = "0.9.1", default-features = false }
# The arrays netcdf-reader returns, moved into plain vectors (source.rs).
ndarray = { version = "0.17", default-features = false, features = ["std"] }
netcdf-reader = { version = "0.9.1", default-features = false, features = ["netcdf4"] }
thiserror = "2"
# The I/O runtime remote reads run on, and `block_in_place` around a field
# read's fill and wait (io.rs, field.rs).
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
# `test_util::quick_backoff`: a throttling test host's back-off in
# milliseconds, not seconds (#1290).
ds-storage = { path = "../storage", features = ["test-util"] }
tempfile = "3"
# The THREDDS catalogs the catalog-route tests serve are written with
# quick_xml::Writer, never format! (Critical Rule 3).
quick-xml = "0.42"
toml = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
# The lines a scan logs, captured (#1290).
tracing-subscriber = "0.3"
