[package]
name = "engine-zarr"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
ds-core = { path = "../core" }
ds-poll = { path = "../ds-poll" }
ds-storage = { path = "../storage" }
# Compressed chunk-bytes LRU cache for the remote byte-range reader.
ds-cache = { path = "../ds-cache" }
# The fail-fast byte budget behind `read_budget`.
ds-executor = { path = "../ds-executor" }
bytes = "1"
flate2 = "1"
# The bounded decode in `codec_limits` and engine-zarr's own `zstd` codec
# plugin. `experimental` bounds frames that do not record their size
# (`Decompressor::upper_bound`). 0.14.3 is the first release past the zstd
# 0.13 advisories (RUSTSEC-2026-0391, 0395 to 0406).
zstd = { version = "0.14.3", default-features = false, features = ["experimental"] }
# Registers the `zstd` codec plugin with zarrs' compile-time registry.
inventory = "0.3"
async-trait = { version = "0.1", optional = true }
rayon = "1"
# Borrow one output view at a time for serial zarrs decode-into calls.
unsafe_cell_slice = "0.2"
futures = { version = "0.3", optional = true }
# Zarr V2/V3 format + codec pipeline (blosc/gzip/crc32c/sharding/transpose).
# `filesystem` gives the local-directory store used for the Phase-1 backend;
# `ndarray` is the multi-dimensional element view used to slice chunks.
# NEVER enable zarrs' `zstd` feature: it pins the zstd 0.13 line (unpatched
# RustSec advisories) and would register a second, unbounded `zstd` codec.
# engine-zarr registers its own (`codec_limits/zstd_codec.rs`).
zarrs = { version = "0.23", default-features = false, features = [
    "filesystem",
    "ndarray",
    "blosc",
    "gzip",
    "crc32c",
    "sharding",
    "transpose",
] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
thiserror = "2"

# Icechunk support (#335) — optional/feature-gated; heavy transactional engine.
# `zarrs/async` is required for the async Icechunk store + deadline-aware bridge.
# Select only the `object_store`-based S3 backend (+ local filesystem), NOT
# icechunk's default `s3` backend which pulls the full `aws-sdk-s3` tree — we
# reuse the same `object_store` crate `ds-storage` already links. The
# backend-forwarding features were published in zarrs_icechunk 0.5.1; 2.1.0 is
# the first release carrying the `object-store-s3`-without-`s3` build fix
# (earth-mover/icechunk#2190). 2.3.0 replaced `Repository::open(config,
# storage, credentials)` with the `RepositoryBuilder` this crate now uses
# (earth-mover/icechunk#2445), so it is the floor.
icechunk = { version = "2.3", optional = true, default-features = false, features = [
    "object-store-s3",
    "object-store-fs",
] }
zarrs_icechunk = { version = "0.5.1", optional = true, default-features = false, features = [
    "object-store-s3",
    "object-store-fs",
] }

[features]
icechunk = ["dep:icechunk", "dep:zarrs_icechunk", "dep:futures", "dep:async-trait", "zarrs/async"]

[dev-dependencies]
tempfile = "3"
