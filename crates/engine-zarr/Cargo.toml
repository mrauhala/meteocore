[package]
name = "engine-zarr"
version = "0.1.0"
edition = "2021"

[dependencies]
ds-core = { path = "../core" }
ds-storage = { path = "../storage" }
# Compressed chunk-bytes LRU cache for the remote byte-range reader.
quick_cache = "0.6"
bytes = "1"
# Zarr V2/V3 format + codec pipeline (blosc/zstd/gzip/crc32c/sharding/transpose).
# `filesystem` gives the local-directory store used for the Phase-1 backend;
# `ndarray` is the multi-dimensional element view used to slice chunks.
zarrs = { version = "0.23", default-features = false, features = [
    "filesystem",
    "ndarray",
    "blosc",
    "zstd",
    "gzip",
    "crc32c",
    "sharding",
    "transpose",
] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
thiserror = "2"

# Icechunk support (#335) — optional/feature-gated; heavy transactional engine.
# `zarrs/async` is required for the async Icechunk store + the async→sync adapter.
# Select only the `object_store`-based S3 backend (+ local filesystem), NOT
# icechunk's default `s3` backend which pulls the full `aws-sdk-s3` tree — we
# reuse the same `object_store` crate `ds-storage` already links. The
# backend-forwarding features were published in zarrs_icechunk 0.5.1; `icechunk`
# still needs the workspace-root `[patch]` until a release > 2.0.6 carries the
# `object-store-s3`-without-`s3` build fix (earth-mover/icechunk#2190).
icechunk = { version = "2", optional = true, default-features = false, features = [
    "object-store-s3",
    "object-store-fs",
] }
zarrs_icechunk = { version = "0.5.1", optional = true, default-features = false, features = [
    "object-store-s3",
    "object-store-fs",
] }

[features]
icechunk = ["dep:icechunk", "dep:zarrs_icechunk", "zarrs/async"]

[dev-dependencies]
tempfile = "3"
