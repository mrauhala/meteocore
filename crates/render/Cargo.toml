[package]
name = "ds-render"
version = "0.1.0"
edition = "2021"

[dependencies]
ds-core = { path = "../core" }
png = "0.17"
jpeg-encoder = "0.6"
webp = { version = "0.3", default-features = false }
quick_cache = "0.6"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
# CPU data-parallelism for the meta-tile assembly (per-output-row, pure compute,
# no I/O). A compute dependency, not a framework.
rayon = "1"
