[package]
name = "ds-render"
version = "0.1.0"
edition = "2021"
license.workspace = true
# Uses `slice::as_chunks` (stable 1.88), a clippy-preferred idiom it lints
# for. Declared so an older toolchain fails clearly.
rust-version = "1.88"

[dependencies]
ds-core = { path = "../core" }
png = "0.18"
jpeg-encoder = "0.7"
webp = { version = "0.3", default-features = false }
ds-cache = { path = "../ds-cache" }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"

[features]
# `test-util`: `TilePixelCache::fill_for_test`, which fills gigabytes of a
# meta-tile cache's budget with a few megabytes, for the server's reload
# tests (#1311). Enabled only on dev-dependencies.
test-util = []

[dev-dependencies]
toml = "1.1"
