[package]
name = "engine-odim"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
ds-core = { path = "../core" }
ds-poll = { path = "../ds-poll" }
ds-storage = { path = "../storage" }
hdf5-reader = "0.9.1"
ndarray = "0.17"
chrono = { version = "0.4", features = ["serde"] }
arc-swap = "1"
quick_cache = "0.6"
ds-cache = { path = "../ds-cache" }
ds-executor = { path = "../ds-executor" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
# 3D Tiles encoding for the gen_3dtiles example + VolumeEngine integration test.
ds-3dtiles = { path = "../ds-3dtiles" }
ds-render = { path = "../render" }
# The GET-counting object store of the shared volume read tests (#1127).
async-trait = "0.1"
futures = "0.3"
