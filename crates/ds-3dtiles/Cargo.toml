[package]
name = "ds-3dtiles"
version = "0.1.0"
edition = "2021"
# Uses `slice::as_chunks` (stable 1.88), `u*::is_multiple_of` (1.87) and
# `Option::is_none_or` (1.82) — all clippy-preferred idioms it lints for.
# Declared so an older toolchain fails clearly.
rust-version = "1.88"

[dependencies]
ds-core = { path = "../core" }
ds-render = { path = "../render" }
serde_json = "1"
thiserror = "2"
