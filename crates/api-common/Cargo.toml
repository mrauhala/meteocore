[package]
name = "api-common"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
ds-core = { path = "../core" }
axum = "0.8"
chrono = "0.4"
serde_json = "1"
form_urlencoded = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
