[package]
name = "engine-cap"
version = "0.1.0"
edition = "2021"

[dependencies]
ds-core = { path = "../core" }
ds-poll = { path = "../ds-poll" }
ds-storage = { path = "../storage" }
ds-wis2 = { path = "../ds-wis2" }
ds-render = { path = "../render" }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the WIS2 state snapshot (src/persist.rs) must read back the
# exact coordinates it wrote, or a restore changes data_version (#1000).
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["serde"] }
arc-swap = "1"
rstar = "0.12"
url = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
futures = "0.3"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
ds-wis2 = { path = "../ds-wis2" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
