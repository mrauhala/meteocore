[package]
name = "server"
version = "0.8.1"
edition = "2021"

[features]
# Read Icechunk repositories in the Zarr engine (#335). Off by default (heavy
# dep tree); enable with `cargo run -p server --features icechunk`.
icechunk = ["engine-zarr/icechunk"]

[dependencies]
toml = "0.8"
ds-core = { path = "../core" }
engine-csv = { path = "../engine-csv" }
engine-geojson = { path = "../engine-geojson" }
engine-geotiff = { path = "../engine-geotiff" }
engine-querydata = { path = "../engine-querydata" }
engine-grib = { path = "../engine-grib" }
engine-zarr = { path = "../engine-zarr" }
engine-odim = { path = "../engine-odim" }
engine-cap = { path = "../engine-cap" }
engine-postgis = { path = "../engine-postgis" }
engine-nowcast = { path = "../engine-nowcast" }
api-edr = { path = "../api-edr" }
api-features = { path = "../api-features" }
api-wms = { path = "../api-wms" }
api-maps = { path = "../api-maps" }
api-tiles = { path = "../api-tiles" }
api-3dtiles = { path = "../api-3dtiles" }
ds-render = { path = "../render" }
ds-mvt = { path = "../ds-mvt" }
ds-cache = { path = "../ds-cache" }
arc-swap = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
http-body = "1"
notify = "8"
rust-embed = { version = "8", features = ["include-exclude"] }
# `default-features = false` drops the `protobuf` feature — we only ever emit
# the Prometheus text exposition format (`TextEncoder` in admin.rs), and the
# default feature drags in `protobuf 2.x`, which is stuck on RUSTSEC-2024-0437
# (uncontrolled recursion; fixed only in protobuf 3.x, which prometheus 0.13
# does not use).
prometheus = { version = "0.13", default-features = false }
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"] }
tikv-jemallocator = { version = "0.7", features = ["stats"] }
