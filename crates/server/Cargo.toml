[package]
name = "server"
version = "0.6.0"
edition = "2021"

[features]
# Read Icechunk repositories in the Zarr engine (#335). Off by default (heavy
# dep tree); enable with `cargo run -p server --features icechunk`.
icechunk = ["engine-zarr/icechunk"]

[dependencies]
ds-core = { path = "../core" }
engine-csv = { path = "../engine-csv" }
engine-geojson = { path = "../engine-geojson" }
engine-geotiff = { path = "../engine-geotiff" }
engine-querydata = { path = "../engine-querydata" }
engine-grib = { path = "../engine-grib" }
engine-zarr = { path = "../engine-zarr" }
engine-odim = { path = "../engine-odim" }
engine-postgis = { path = "../engine-postgis" }
api-edr = { path = "../api-edr" }
api-features = { path = "../api-features" }
api-wms = { path = "../api-wms" }
api-maps = { path = "../api-maps" }
api-tiles = { path = "../api-tiles" }
ds-render = { path = "../render" }
ds-mvt = { path = "../ds-mvt" }
arc-swap = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
http-body = "1"
notify = "8"
rust-embed = { version = "8", features = ["include-exclude"] }
prometheus = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
