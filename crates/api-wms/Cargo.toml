[package]
name = "api-wms"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
api-common = { path = "../api-common" }
ds-executor = { path = "../ds-executor" }
ds-core = { path = "../core" }
ds-render = { path = "../render" }
arc-swap = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
# GetCapabilities is gzipped once per cached document (#1482); already in
# the graph through ds-wis2 and tower-http.
flate2 = "1"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
# `rt`: a GetCapabilities miss builds on the blocking pool, `time`: its
# window on tokio's clock (#1482).
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
# `test-util`: the capabilities window on a paused clock (#1482).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tower = { version = "0.5", features = ["util"] }
# Capture log lines: an `Internal` error's detail is logged exactly once (#1484).
tracing-subscriber = "0.3"
http-body-util = "0.1"
# Decode GetMap PNGs to assert TRANSPARENT/BGCOLOR pixels (#163); already
# in the graph via ds-render.
png = "0.18"
