[package]
name = "api-tiles"
version = "0.1.0"
edition = "2021"

[dependencies]
ds-core = { path = "../core" }
ds-render = { path = "../render" }
ds-mvt = { path = "../ds-mvt" }
arc-swap = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
