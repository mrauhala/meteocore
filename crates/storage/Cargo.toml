[package]
name = "ds-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
ds-core = { path = "../core" }
# 0.14.1 is the first release built on `quick-xml >= 0.41`, which is what
# RUSTSEC-2026-0194/0195 require (#584) — object_store is the only thing that
# was still pulling the vulnerable 0.37 line. It is also the version
# `icechunk` already links under the `engine-zarr/icechunk` feature, so this
# collapses what used to be two copies of object_store in the tree into one.
object_store = { version = "0.14.1", features = ["aws", "http"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
chrono = "0.4"
bytes = "1"
futures = "0.3"
url = "2"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
