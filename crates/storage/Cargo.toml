[package]
name = "ds-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
ds-core = { path = "../core" }
object_store = { version = "0.11", features = ["aws", "http"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
chrono = "0.4"
bytes = "1"
futures = "0.3"
url = "2"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
