[package]
name = "ds-storage"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
ds-core = { path = "../core" }
# 0.14.1 is the first release built on `quick-xml >= 0.41`, which is what
# RUSTSEC-2026-0194/0195 require (#584) — object_store is the only thing that
# was still pulling the vulnerable 0.37 line. It is also the version
# `icechunk` already links under the `engine-zarr/icechunk` feature, so this
# collapses what used to be two copies of object_store in the tree into one.
object_store = { version = "0.14.1", features = ["aws", "http"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
chrono = "0.4"
bytes = "1"
futures = "0.3"
url = "2"
tracing = "0.1"
thiserror = "2"
# Filename → timestamp matching in `discovery::FilenameMatcher` (#817).
regex = "1"
# The per-host request gauges (`gauge.rs`) implement `ObjectStore`.
async-trait = "0.1"
# THREDDS catalog discovery (`discovery::thredds`, #1170): catalog.xml read
# as events, and catalog URLs' paths compared decoded.
quick-xml = "0.42"
percent-encoding = "2"
# The request of a document GET (`document.rs`), sent through the host's
# own transport.
http = "1"

[features]
# `test_util`: a store whose GET bodies stall and a paused-clock harness, for
# the fetch-budget tests of crates that read through a `DataStore` (#1055).
# Enabled only on dev-dependencies.
test-util = ["tokio/test-util"]

[dev-dependencies]
tempfile = "3"
# Paused virtual time for the fetch-budget tests (#1011): a 120 s budget is
# tested without waiting for it.
tokio = { version = "1", features = ["macros", "test-util"] }
# The `storage` span tests (#1233) read the log lines the server's
# `LOG_FORMAT=json` subscriber writes.
tracing-subscriber = { version = "0.3", features = ["json"] }
serde_json = "1"
