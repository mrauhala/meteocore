[package]
name = "ds-storage"
version.workspace = true
edition.workspace = true

[dependencies]
ds-core = { path = "../core" }
object_store = { version = "0.11", features = ["aws", "http"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
bytes = "1"
futures = "0.3"
url = "2"
tracing = "0.1"
thiserror = "2"
