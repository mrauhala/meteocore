[package]
name = "ds-bufr"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "BUFR decoder derived from tinybufr 0.1.3 with operational SYNOP fixes"

[dependencies]
bitstream-io = "4.5.0"
byteorder = "1.5.0"
hashbrown = "0.15.5"
smallvec = "1.15.1"
thiserror = "2.0.14"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
jma = []
