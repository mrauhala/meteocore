[package]
name = "api-edr"
version = "0.1.0"
edition = "2021"

[dependencies]
ds-core = { path = "../core" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
jsonschema = "0.28"
serde_json = "1"
