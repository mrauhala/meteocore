id = "meps-northeurope"
title = "MEPS Surface (Scandinavia sample)"
description = "MetCoOp MEPS surface forecast on its native Lambert conformal conic (tangent cone) grid, from a cropped QueryData sample."
data_path = "testdata/meps"
engine_type = "querydata"
apis = ["edr", "wms", "maps", "tiles"]

[querydata]
wms_parameter = "Temperature"
poll_interval_secs = 60

# No [wms]: each parameter's unit comes from its FMI parameter number, so
# Temperature (°C) and Mean Sea Level Pressure (hPa) take the built-in
# temperature and pressure defaults, and the collection layer draws its
# default Temperature with that style.
