id = "noaa-gfs"
title = "NOAA GFS Global Forecast"
description = "GFS deterministic forecast (0.25 deg) from NOAA Open Data on AWS"
engine_type = "grib"
apis = ["edr", "wms", "maps", "tiles"]
keywords = ["forecast", "GFS", "NOAA", "global", "temperature", "pressure", "wind"]

[license]
title = "NOAA / NWS public domain data"
url = "https://www.weather.gov/disclaimer"

[grib]
endpoint = "https://s3.us-east-1.amazonaws.com"
bucket = "noaa-gfs-bdp-pds"
prefix_pattern = "gfs.%Y%m%d/{run}/atmos/"
# GFS atmos directories contain several product variants that all end in
# .idx (pgrb2.0p25, pgrb2.0p50, pgrb2.1p00, pgrb2b, goessimpgrb2, ...).
# filename_contains narrows to just the 0.25-degree forecast files. The
# "z.pgrb2.0p25.f" prefix prevents matching "goessimpgrb2.0p25.f" which
# has a substring collision if you only match "pgrb2.0p25.f".
filename_contains = "z.pgrb2.0p25.f"
index_suffix = ".idx"
data_suffix = ""
index_format = "wgrib2"
poll_interval_secs = 600
max_runs = 1
run_hours = [0, 6, 12, 18]
# Most common near-surface fields. A single GFS 0.25 deg file contains ~700
# messages; the parameters filter is strongly recommended for wgrib2 indexes.
parameters = ["TMP", "DPT", "PRMSL", "UGRD", "VGRD", "GUST", "TCDC", "PRATE"]

# The first near-surface field in this product is PRMSL. Match its hPa
# display units for requests without a parameter or named style.
[wms]
colormap = "pressure"
min = 950.0
max = 1050.0

# Named styles expose explicit fields through Maps collection discovery.
[[wms.styles]]
name = "temperature"
title = "Temperature · default level"
parameter = "TMP"
colormap = "temperature"

[[wms.styles]]
name = "pressure"
title = "Mean sea level pressure · hPa"
parameter = "PRMSL"
colormap = "pressure"
min = 950.0
max = 1050.0

[[wms.styles]]
name = "wind-gust"
title = "Wind gust · m/s"
parameter = "GUST"
colormap = "wind_speed"

[[wms.parameters]]
name = "TMP"
colormap = "temperature"

[[wms.parameters]]
name = "DPT"
colormap = "temperature"

[[wms.parameters]]
name = "PRMSL"
colormap = "pressure"
min = 950.0
max = 1050.0

[[wms.parameters]]
name = "UGRD"
colormap = "wind_speed"

[[wms.parameters]]
name = "VGRD"
colormap = "wind_speed"

[[wms.parameters]]
name = "GUST"
colormap = "wind_speed"

[[wms.parameters]]
name = "TCDC"
colormap = "grayscale"
min = 0.0
max = 100.0

[[wms.parameters]]
name = "PRATE"
colormap = "precipitation_rate"
