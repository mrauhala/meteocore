id = "meps-netcdf-local"
title = "MEPS Surface (CF-NetCDF, local sample)"
description = "MetCoOp MEPS 2.5 km surface forecast, control member, read from MET Norway's per-lead CF-NetCDF files on their Lambert conformal conic grid. A committed sample: every 100th grid point of two runs (2026-10-15 06Z leads 0-3, 09Z leads 0-2)."
engine_type = "netcdf"
# EDR position, area and radius, model runs as instances; the WMS layers
# answer GetFeatureInfo. The 10 m wind's speed is derived from its
# grid-relative x/y components (`wind_speed_10m`, no direction on this
# Lambert grid), and the 2 m dew point from the temperature and relative
# humidity (`dew_point_temperature_2m`, in °C).
apis = ["edr", "wms", "maps", "tiles"]
keywords = ["forecast", "NWP", "MEPS", "NetCDF"]

[license]
title = "CC-BY-4.0"

[netcdf]
# The per-lead files of one family (sfc), as named on thredds.met.no.
# Regenerate from the CDLs with `ncgen -k nc4`; see testdata/meps-netcdf/README.md.
data_path = "testdata/meps-netcdf"
filename_template = "meps_sfc_{lead}_%Y%m%dT{run}Z.nc"
variables = [
    "air_temperature_2m",
    "relative_humidity_2m",
    "x_wind_10m",
    "y_wind_10m",
    "wind_speed_of_gust",
    "air_pressure_at_sea_level",
    "precipitation_amount_acc",
    "cloud_area_fraction",
]
max_runs = 4
poll_interval_secs = 60

[netcdf.titles]
# Accumulated from the run's start, not per step. Its amount per step is
# derived as `precipitation_amount`, titled "Precipitation amount (1 h
# accumulation)": the accumulation less the run's previous lead's, clamped
# at zero (`derive_per_step = false` turns it off).
precipitation_amount_acc = "Precipitation accumulated since run start"
x_wind_10m = "10 m wind along the grid's x axis"
y_wind_10m = "10 m wind along the grid's y axis"

# Values are served in display units, converted from each variable's CF
# units: temperature in °C (the files' K), MSLP in hPa (Pa), the
# accumulated precipitation in mm (kg/m^2), and relative humidity and cloud
# cover in % (unit "1", whose standard names say they are fractions); wind
# in m/s as stored. Each layer without an entry below takes the built-in
# default its name and unit select: temperature over -90…50 °C, pressure
# over 950…1050 hPa, wind speed for the gusts, 0-200 mm for the
# accumulated precipitation, 0-50 mm for the hourly precipitation derived
# from it (`precipitation_amount`), the derived dew point on the temperature
# palette, and relative humidity and cloud cover on the percent palettes over
# 0-100 %.
[wms]
# The collection's own palette, for a variable no default matches: the
# temperature palette over its own -90…50 °C, the first variable's.
colormap = "temperature"
# A WebP request without a quality of its own is lossy at 80: continuous
# palettes exceed PNG8's 256 colours (README, "Choosing an image format").
webp_quality = 80

# Deliberately narrower than the default's ±40 m/s for wind components,
# so common 10 m winds span the whole palette.
[[wms.parameters]]
name = "x_wind_10m"
colormap = "diverging"
min = -20.0
max = 20.0

[[wms.parameters]]
name = "y_wind_10m"
colormap = "diverging"
min = -20.0
max = 20.0

# Discovery (#1356): the WIS2 topic is served as the collection's themes.
[discovery]
wis2_topic = "weather/prediction/forecast/short-range/deterministic/limited-area"
