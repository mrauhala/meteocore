id = "meps-netcdf-local"
title = "MEPS Surface (CF-NetCDF, local sample)"
description = "MetCoOp MEPS 2.5 km surface forecast, control member, read from MET Norway's per-lead CF-NetCDF files on their Lambert conformal conic grid. A committed sample: every 100th grid point of two runs (2026-10-15 06Z leads 0-3, 09Z leads 0-2)."
engine_type = "netcdf"
# EDR comes with the engine's position queries (#1067).
apis = ["wms", "maps", "tiles"]
keywords = ["forecast", "NWP", "MEPS", "NetCDF"]

[license]
title = "CC-BY-4.0"

[netcdf]
# The per-lead files of one family (sfc), as named on thredds.met.no.
# Regenerate from the CDLs with `ncgen -k nc4`; see testdata/meps-netcdf/README.md.
data_path = "testdata/meps-netcdf"
filename_template = "meps_sfc_{lead}_%Y%m%dT{run}Z.nc"
variables = [
    "air_temperature_2m",
    "relative_humidity_2m",
    "x_wind_10m",
    "y_wind_10m",
    "wind_speed_of_gust",
    "air_pressure_at_sea_level",
    "precipitation_amount_acc",
    "cloud_area_fraction",
]
max_runs = 4
poll_interval_secs = 60

[netcdf.titles]
# Accumulated from the run's start, served as it is stored.
precipitation_amount_acc = "Precipitation accumulated since run start"
x_wind_10m = "10 m wind along the grid's x axis"
y_wind_10m = "10 m wind along the grid's y axis"

# Values are served in the files' own units: K, Pa, m/s, kg/m^2 and
# fractions (units "1"). Each layer without an entry below takes the
# built-in default its name and unit select: temperature over -90…50 °C in
# kelvin, pressure over 950…1050 hPa in pascals, wind speed for the gusts,
# 0-200 mm for the accumulated precipitation.
[wms]
# The °C temperature palette over -90…50 °C in kelvin.
colormap = "temperature"
min = 183.15
max = 323.15

[[wms.parameters]]
name = "relative_humidity_2m"
colormap = "viridis"
min = 0.0
max = 1.0

# Narrower than the default's ±40 m/s for wind components.
[[wms.parameters]]
name = "x_wind_10m"
colormap = "diverging"
min = -20.0
max = 20.0

[[wms.parameters]]
name = "y_wind_10m"
colormap = "diverging"
min = -20.0
max = 20.0

[[wms.parameters]]
name = "cloud_area_fraction"
colormap = "grayscale"
min = 0.0
max = 1.0
