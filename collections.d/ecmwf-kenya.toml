id = "ecmwf-kenya"
title = "ECMWF Kenya Surface"
description = "ECMWF surface forecast for Kenya region (temperature, pressure, wind, precipitation)"
data_path = "testdata/ecmwf-kenya"
engine_type = "querydata"
apis = ["edr", "wms", "maps", "tiles"]

[querydata]
wms_parameter = "2t"
poll_interval_secs = 60

# No [wms]: each parameter's unit comes from its FMI parameter number, so the
# parameter layers take the built-in defaults: 2t temperature (°C), msl
# pressure (hPa), rr1h precipitation (mm). The collection layer draws its
# default parameter, 2t, with that layer's style.
