id = "radar-eu-composite-dbzh-s3-cog"
title = "OPERA — radar reflectivity composite (S3, COG)"
description = "Pan-European radar reflectivity (DBZH) composite from EUMETNET OPERA via CloudFerro S3. ETRS89-LAEA, Cloud-Optimized GeoTIFF."
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[geotiff]
endpoint = "https://s3.waw3-1.cloudferro.com"
bucket = "openradar-24h"
prefix_pattern = "%Y/%m/%d/OPERA/COMP/"
time_window = "-PT12H"
filename_template = "OPERA@%Y%m%dT%H%M@0@DBZH.tiff"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 300

[wms]
style_bundle = "radar_multi"
