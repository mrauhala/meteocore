id = "radar-eu-composite-acrr-s3-cog"
title = "OPERA — radar 1 h precipitation (S3, COG)"
description = "Pan-European 1-hour accumulated radar precipitation (ACRR) from EUMETNET OPERA via CloudFerro S3. ETRS89-LAEA, Cloud-Optimized GeoTIFF."
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[geotiff]
endpoint = "https://s3.waw3-1.cloudferro.com"
bucket = "openradar-24h"
prefix_pattern = "%Y/%m/%d/OPERA/COMP/"
time_window = "-PT2H"
filename_template = "OPERA@%Y%m%dT%H%M@0@ACRR.tiff"
parameter = "precipitation"
unit = "mm"
poll_interval_secs = 300

[wms]
colormap = "viridis"

[[wms.styles]]
name = "grayscale"
title = "Grayscale"
colormap = "grayscale"
min = 0.0
max = 70.0

[[wms.styles]]
name = "viridis"
title = "Viridis"
colormap = "viridis"
min = 0.0
max = 70.0
