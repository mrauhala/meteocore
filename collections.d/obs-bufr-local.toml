id = "obs-bufr-local"
title = "Surface observations (BUFR, local demo)"
description = "SYNOP station reports decoded from WMO BUFR files — eight real reports captured from the WIS2 Global Broker on 2026-09-12 08:00Z. One location per station, one PointSeries per station and time window; stations as Point features, and on a map as markers coloured by each parameter's latest value."
engine_type = "bufr"
apis = ["edr", "features", "wms", "maps", "tiles"]
keywords = ["observations", "SYNOP", "BUFR", "WMO", "stations"]

[license]
title = "CC-BY-4.0"

[bufr]
# Directory or object-store prefix of *.bufr files, re-listed every
# poll_interval_secs; only files not seen before are fetched. Swap for a WIS2
# subscription with [bufr.wis2] (mutually exclusive) — see the docs.
data_path = "testdata/bufr-synop"
poll_interval_secs = 60
# The demo fixtures are from 2026-09-12 — a production feed keeps the default
# PT24H so the store stays bounded (retention × cadence × stations).
retention = "P36500D"
max_stations = 50000
position_radius_km = 25.0   # EDR position → nearest station within this radius
# builtin_parameters = true  # the SYNOP essentials (air_temperature, pressure_msl, …)
# [[bufr.parameters]]         # override a built-in by name, or add your own
# name = "rain_2h"
# descriptors = ["013011"]    # Table B FXXYYY (first match wins)
# unit = "kg m-2"               # the BUFR Table B unit; K/Pa/kg m-2 are served as °C/hPa/mm
# period_hours = 2            # for period-qualified elements

# Station symbol layers (#1204): one map layer per parameter, each station a
# marker coloured by its latest report within max_age. The map APIs in `apis`
# turn them on; the section is optional (the defaults are shown). The layers
# take the built-in default style their name and unit select (air
# temperature in °C, pressure in hPa, ...).
[bufr.map]
max_age = "PT1H"
time_step = "PT10M"
marker_size = 6
draw_missing = false

# Discovery (#1356): the WIS2 topic is served as the collection's themes.
[discovery]
wis2_topic = "weather/surface-based-observations/synop"
