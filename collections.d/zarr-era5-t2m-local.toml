id = "zarr-era5-t2m-local"
title = "ERA5-like Surface Fields (Zarr V3, local)"
description = "Synthetic CF-conventions Zarr V3 store (2 m temperature, mean sea level pressure, precipitation rate) served from a local directory. A small, network-free demo of the Zarr engine — EDR position queries plus WMS/Maps/Tiles rendering."
engine_type = "zarr"
apis = ["edr", "wms", "maps", "tiles"]
keywords = ["temperature", "pressure", "precipitation", "reanalysis", "zarr"]

[zarr]
# Local Zarr store root (relative to the config's parent dir / working dir).
# Regenerate with: cargo run -p engine-zarr --example gen_fixture
data_path = "testdata/zarr-era5-t2m"
zarr_version = 3
poll_interval_secs = 300
# Optional: expose only some variables. The fixture has `msl` (Pa), `mtpr`
# (kg m**-2 s**-1), `t2m` (K, float32) and `t2m_packed` (K, int16 with
# scale_factor/add_offset). Default = all.
# parameters = ["t2m"]

# Values are served in display units, converted from each variable's CF
# units: temperature in °C (the store's K), MSLP in hPa (Pa) and the
# precipitation rate in mm/h (kg m-2 s-1). Each variable's layer takes the
# built-in default its name and unit select: temperature over -90…50 °C,
# pressure over 950…1050 hPa, precipitation rate over 0…30 mm/h.
[wms]
# The collection's own layer draws the first variable, `msl`: the pressure
# palette over its own 950…1050 hPa.
colormap = "pressure"
# A WebP request without a quality of its own is lossy at 80: continuous
# palettes exceed PNG8's 256 colours (README, "Choosing an image format").
webp_quality = 80
