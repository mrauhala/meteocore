# DMI Denmark national radar composite (ODIM_H5 COMP)
#
# Reads `dk.com.YYYYMMDDHHMM.500_max.h5` files: 500m maximum-reflectivity
# composite over Denmark, ~1984x1728 grid in Stereographic projection
# (lat_0=56, lon_0=10.5666, lat_ts=56). DBZH quantity, gain=0.5, offset=-32,
# nodata=255 — standard radar reflectivity scaling.
#
# The sample files in `testdata/radar-dmi/` were sourced from DMI's open
# radardata API (https://opendataapi.dmi.dk/v1/radardata/collections/composite).
# STAC-backed live fetch is Phase 2 of the engine roadmap; for now they
# need to be downloaded into the directory by hand.

id = "radar-dk-composite-dbzh-local-h5"
title = "DMI — radar reflectivity composite (local, ODIM_H5)"
description = "Danish 500 m maximum-reflectivity (DBZH) radar composite from DMI, native ODIM_H5 from local sample files. Stereographic projection."
engine_type = "odim"
apis = ["edr", "wms", "maps", "tiles"]
data_path = "testdata/radar-dmi"

[odim]
filename_template = "dk.com.%Y%m%d%H%M.500_max.h5"
parameter = "reflectivity"
unit = "dBZ"

[wms]
colormap = "radar_dbz"
