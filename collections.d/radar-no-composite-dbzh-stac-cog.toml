id = "radar-no-composite-dbzh-stac-cog"
title = "MET Norway — radar reflectivity mosaic (STAC, COG)"
description = "Norwegian radar reflectivity (DBZH) mosaic from MET Norway via STAC catalogue. Lambert Conformal Conic, Cloud-Optimized GeoTIFF."
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[geotiff]
stac_url = "https://radar-stacapi.met.no/v1/collections/Mosaic-Norway-v1/items"
stac_asset_key = "data"
stac_asset_allowlist = ["https://rgw.met.no/"]
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 300

[wms]
style_bundle = "radar_multi"

# Bound the /preview SPA's time slider to the last 12 hours. The STAC archive
# covers >1 year of 5-minute mosaics; without this cap the slider becomes a
# 1000-stop bar covering ~83h that's unusable for scrubbing recent radar.
# Only affects the preview manifest — the underlying engine still loads
# whatever the STAC catalogue advertises.
[preview]
time_window = "PT12H"
