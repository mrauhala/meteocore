id = "radar-fi-composite-dbzh-s3-cog"
title = "FMI — radar reflectivity composite (S3, COG)"
description = "Finnish radar reflectivity (DBZH) composite from FMI's open-data S3 bucket. EPSG:3067 Transverse Mercator, Cloud-Optimized GeoTIFF."
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[geotiff]
endpoint = "https://s3-eu-west-1.amazonaws.com"
bucket = "fmi-opendata-radar-geotiff"
prefix_pattern = "%Y/%m/%d/finrad/"
time_window = "-PT2H"
filename_template = "%Y%m%d%H%M_composite_cappi_600_dbzh_finrad_qc.tif"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 300
nodata = 255

[wms]
style_bundle = "radar_multi"
