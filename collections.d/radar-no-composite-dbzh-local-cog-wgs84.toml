id = "radar-no-composite-dbzh-local-cog-wgs84"
title = "MET Norway — radar reflectivity mosaic (local, WGS84)"
description = "Norwegian radar reflectivity (DBZH) mosaic from MET Norway, reprojected to WGS84, from local sample files."
data_path = "testdata/radar"
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[geotiff]
filename_template = "radar_%Y%m%dT%H%MZ.tif"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 30

[wms]
colormap = "radar_dbz"

[[wms.styles]]
name = "grayscale"
title = "Grayscale"
colormap = "grayscale"
min = 0.0
max = 70.0

[[wms.styles]]
name = "viridis"
title = "Viridis"
colormap = "viridis"
min = 0.0
max = 70.0
