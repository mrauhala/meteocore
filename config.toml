[server]
host = "127.0.0.1"
port = 8000

[[collections]]
id = "weather"
title = "Finnish Weather Observations"
description = "Hourly weather observations from Finnish weather stations"
data_path = "testdata/weather.csv"
apis = ["edr", "features"]

[[collections]]
id = "municipalities"
title = "Finnish Municipalities"
description = "Municipality boundaries from Statistics Finland (1:1M scale)"
data_path = "testdata/municipalities.geojson"
engine_type = "geojson"
apis = ["features"]

[[collections]]
id = "regions"
title = "Finnish Regions"
description = "Regional boundaries (maakunta) from Statistics Finland (1:1M scale)"
data_path = "testdata/regions.geojson"
engine_type = "geojson"
apis = ["features"]

[[collections]]
id = "radar"
title = "Weather Radar Reflectivity"
description = "Radar composite from MET Norway (preprocessed to WGS84)"
data_path = "testdata/radar"
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[collections.geotiff]
filename_template = "radar_%Y%m%dT%H%MZ.tif"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 30

[collections.wms]
colormap = "radar_dbz"

[[collections.wms.styles]]
name = "grayscale"
title = "Grayscale"
colormap = "grayscale"
min = 0.0
max = 70.0

[[collections.wms.styles]]
name = "viridis"
title = "Viridis"
colormap = "viridis"
min = 0.0
max = 70.0

[[collections]]
id = "radar-norway"
title = "MET Norway Radar (native LCC projection)"
description = "Radar composite in Lambert Conformal Conic, served without reprojection"
data_path = "testdata/radar-native"
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[collections.geotiff]
filename_template = "norway_%Y%m%dT%H%MZ.tiff"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 60

[collections.wms]
colormap = "radar_dbz"

[[collections]]
id = "fmi-radar"
title = "FMI Radar (S3, EPSG:3067)"
description = "Finnish radar composite from FMI S3 bucket, Transverse Mercator projection"
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[collections.geotiff]
endpoint = "https://s3-eu-west-1.amazonaws.com"
bucket = "fmi-opendata-radar-geotiff"
prefix_pattern = "%Y/%m/%d/finrad/"
time_window = "-PT2H"
filename_template = "%Y%m%d%H%M_composite_cappi_600_dbzh_finrad_qc.tif"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 300
nodata = 255

[collections.wms]
colormap = "radar_dbz"

[[collections]]
id = "opera-precipitation"
title = "OPERA European Radar Composite"
description = "1h accumulated precipitation from EUMETNET OPERA, LAEA projection (CloudFerro S3)"
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[collections.geotiff]
endpoint = "https://s3.waw3-1.cloudferro.com"
bucket = "openradar-24h"
prefix_pattern = "%Y/%m/%d/OPERA/COMP/"
time_window = "-PT2H"
filename_template = "OPERA@%Y%m%dT%H%M@0@ACRR.tiff"
parameter = "precipitation"
unit = "mm"
poll_interval_secs = 300

[collections.wms]
colormap = "viridis"

[[collections.wms.styles]]
name = "grayscale"
title = "Grayscale"
colormap = "grayscale"
min = 0.0
max = 70.0

[[collections.wms.styles]]
name = "viridis"
title = "Viridis"
colormap = "viridis"
min = 0.0
max = 70.0

[[collections]]
id = "opera-reflectivity"
title = "OPERA European Radar Reflectivity"
description = "Radar reflectivity composite (DBZH) from EUMETNET OPERA, LAEA projection (CloudFerro S3)"
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[collections.geotiff]
endpoint = "https://s3.waw3-1.cloudferro.com"
bucket = "openradar-24h"
prefix_pattern = "%Y/%m/%d/OPERA/COMP/"
time_window = "-PT12H"
filename_template = "OPERA@%Y%m%dT%H%M@0@DBZH.tiff"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 300

[collections.wms]
colormap = "radar_dbz"

[[collections]]
id = "ecmwf-kenya"
title = "ECMWF Kenya Surface"
description = "ECMWF surface forecast for Kenya region (temperature, pressure, wind, precipitation)"
data_path = "testdata/ecmwf-kenya"
engine_type = "querydata"
apis = ["edr", "wms", "maps", "tiles"]

[collections.querydata]
wms_parameter = "2t"
poll_interval_secs = 60

[collections.wms]
colormap = "viridis"

[[collections.wms.parameters]]
name = "2t"
colormap = "temperature"

[[collections.wms.parameters]]
name = "2d"
colormap = "temperature"

[[collections.wms.parameters]]
name = "msl"
colormap = "viridis"
min = 980.0
max = 1040.0

[[collections.wms.parameters]]
name = "rr1h"
colormap = "precipitation_rate"

[[collections.wms.parameters]]
name = "tp"
colormap = "precipitation"

[[collections]]
id = "ecmwf-ifs"
title = "ECMWF IFS Global Forecast"
description = "IFS deterministic forecast (0.25 deg) from ECMWF open data"
engine_type = "grib"
apis = ["edr", "wms", "maps", "tiles"]

[collections.grib]
endpoint = "https://s3.eu-central-1.amazonaws.com"
bucket = "ecmwf-forecasts"
prefix_pattern = "%Y%m%d/{run}z/ifs/0p25/oper/"
poll_interval_secs = 300
max_runs = 4
run_hours = [0, 6, 12, 18]
parameters = ["2t", "2d", "10u", "10v", "msl", "sp", "tp", "tcc", "tcwv", "cape", "sf", "sd"]

[collections.wms]
colormap = "temperature"

[[collections.wms.parameters]]
name = "2t"
colormap = "temperature"              # -40 to 50 C from stops

[[collections.wms.parameters]]
name = "2d"
colormap = "temperature"

[[collections.wms.parameters]]
name = "msl"
colormap = "viridis"
min = 950.0                           # viridis has no domain-specific range
max = 1050.0

[[collections.wms.parameters]]
name = "sp"
colormap = "viridis"
min = 500.0
max = 1050.0

[[collections.wms.parameters]]
name = "tp"
colormap = "precipitation"            # 0 to 50 mm from stops

[[collections.wms.parameters]]
name = "tcc"
colormap = "grayscale"
min = 0.0                             # grayscale defaults to 0-1, need 0-100
max = 100.0

[[collections.wms.parameters]]
name = "10u"
colormap = "wind_speed"               # 0 to 50 m/s from stops

[[collections.wms.parameters]]
name = "10v"
colormap = "wind_speed"

[[collections.wms.parameters]]
name = "tcwv"
colormap = "viridis"
min = 0.0
max = 70.0

[[collections.wms.parameters]]
name = "cape"
colormap = "viridis"
min = 0.0
max = 3000.0

[[collections.wms.parameters]]
name = "sf"
colormap = "precipitation"

[[collections.wms.parameters]]
name = "sd"
colormap = "viridis"
min = 0.0
max = 1000.0

[[collections]]
id = "met-norway-radar"
title = "MET Norway Radar Mosaic"
description = "Radar reflectivity mosaic from MET Norway via STAC catalog, Lambert Conformal Conic"
engine_type = "geotiff"
apis = ["edr", "wms", "maps", "tiles"]

[collections.geotiff]
stac_url = "https://radar-stacapi.met.no/v1/collections/Mosaic-Norway-v1/items"
stac_asset_key = "data"
stac_asset_allowlist = ["https://rgw.met.no/"]
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 300

[collections.wms]
colormap = "radar_dbz"
