[server]
host = "127.0.0.1"
port = 8000

[[collections]]
id = "weather"
title = "Finnish Weather Observations"
description = "Hourly weather observations from Finnish weather stations"
data_path = "testdata/weather.csv"
apis = ["edr", "features"]

[[collections]]
id = "municipalities"
title = "Finnish Municipalities"
description = "Municipality boundaries from Statistics Finland (1:1M scale)"
data_path = "testdata/municipalities.geojson"
engine_type = "geojson"
apis = ["features"]

[[collections]]
id = "regions"
title = "Finnish Regions"
description = "Regional boundaries (maakunta) from Statistics Finland (1:1M scale)"
data_path = "testdata/regions.geojson"
engine_type = "geojson"
apis = ["features"]

[[collections]]
id = "radar"
title = "Weather Radar Reflectivity"
description = "Radar composite from MET Norway (preprocessed to WGS84)"
data_path = "testdata/radar"
engine_type = "geotiff"
apis = ["edr", "wms"]

[collections.geotiff]
filename_template = "radar_%Y%m%dT%H%MZ.tif"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 30

[collections.wms]
colormap = "radar_dbz"

[[collections.wms.styles]]
name = "grayscale"
title = "Grayscale"
colormap = "grayscale"
min = 0.0
max = 70.0

[[collections.wms.styles]]
name = "viridis"
title = "Viridis"
colormap = "viridis"
min = 0.0
max = 70.0

[[collections]]
id = "radar-norway"
title = "MET Norway Radar (native LCC projection)"
description = "Radar composite in Lambert Conformal Conic, served without reprojection"
data_path = "testdata/radar-native"
engine_type = "geotiff"
apis = ["edr", "wms"]

[collections.geotiff]
filename_template = "norway_%Y%m%dT%H%MZ.tiff"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 60

[collections.wms]
colormap = "radar_dbz"

[[collections]]
id = "fmi-radar"
title = "FMI Radar (S3, EPSG:3067)"
description = "Finnish radar composite from FMI S3 bucket, Transverse Mercator projection"
engine_type = "geotiff"
apis = ["edr", "wms"]

[collections.geotiff]
endpoint = "https://s3-eu-west-1.amazonaws.com"
bucket = "fmi-opendata-radar-geotiff"
prefix_pattern = "%Y/%m/%d/finrad/"
time_window = "-PT2H"
filename_template = "%Y%m%d%H%M_composite_cappi_600_dbzh_finrad_qc.tif"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 300
nodata = 255

[collections.wms]
colormap = "radar_dbz"

[[collections]]
id = "opera-precipitation"
title = "OPERA European Radar Composite"
description = "1h accumulated precipitation from EUMETNET OPERA, LAEA projection (CloudFerro S3)"
engine_type = "geotiff"
apis = ["edr", "wms"]

[collections.geotiff]
endpoint = "https://s3.waw3-1.cloudferro.com"
bucket = "openradar-24h"
prefix_pattern = "%Y/%m/%d/OPERA/COMP/"
time_window = "-PT2H"
filename_template = "OPERA@%Y%m%dT%H%M@0@ACRR.tiff"
parameter = "precipitation"
unit = "mm"
poll_interval_secs = 300

[collections.wms]
colormap = "viridis"

[[collections.wms.styles]]
name = "grayscale"
title = "Grayscale"
colormap = "grayscale"
min = 0.0
max = 70.0

[[collections.wms.styles]]
name = "viridis"
title = "Viridis"
colormap = "viridis"
min = 0.0
max = 70.0

[[collections]]
id = "opera-reflectivity"
title = "OPERA European Radar Reflectivity"
description = "Radar reflectivity composite (DBZH) from EUMETNET OPERA, LAEA projection (CloudFerro S3)"
engine_type = "geotiff"
apis = ["edr", "wms"]

[collections.geotiff]
endpoint = "https://s3.waw3-1.cloudferro.com"
bucket = "openradar-24h"
prefix_pattern = "%Y/%m/%d/OPERA/COMP/"
time_window = "-PT12H"
filename_template = "OPERA@%Y%m%dT%H%M@0@DBZH.tiff"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 300

[collections.wms]
colormap = "radar_dbz"

# MET Norway radar cannot be listed via S3 (AccessDenied on list).
# Individual files are accessible but discovery requires STAC API (Phase 4).
# Use local files or the STAC catalog URL once implemented.
