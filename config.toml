[server]
host = "0.0.0.0"
port = 8000

[[collections]]
id = "weather"
title = "Finnish Weather Observations"
description = "Hourly weather observations from Finnish weather stations"
data_path = "testdata/weather.csv"
apis = ["edr", "features"]

[[collections]]
id = "municipalities"
title = "Finnish Municipalities"
description = "Municipality boundaries from Statistics Finland (1:1M scale)"
data_path = "testdata/municipalities.geojson"
engine_type = "geojson"
apis = ["features"]

[[collections]]
id = "regions"
title = "Finnish Regions"
description = "Regional boundaries (maakunta) from Statistics Finland (1:1M scale)"
data_path = "testdata/regions.geojson"
engine_type = "geojson"
apis = ["features"]

[[collections]]
id = "radar"
title = "Weather Radar Reflectivity"
description = "Radar composite from MET Norway (preprocessed to WGS84)"
data_path = "testdata/radar"
engine_type = "geotiff"
apis = ["edr"]

[collections.geotiff]
filename_pattern = 'radar_(?P<timestamp>\d{8}T\d{4}Z)\.tif'
timestamp_format = "%Y%m%dT%H%MZ"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 30

[[collections]]
id = "radar-norway"
title = "MET Norway Radar (native LCC projection)"
description = "Radar composite in Lambert Conformal Conic, served without reprojection"
data_path = "testdata/radar-native"
engine_type = "geotiff"
apis = ["edr"]

[collections.geotiff]
filename_pattern = 'norway_(?P<timestamp>\d{8}T\d{4}Z)\.tiff'
timestamp_format = "%Y%m%dT%H%MZ"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 60

[[collections]]
id = "fmi-radar"
title = "FMI Radar (S3, EPSG:3067)"
description = "Finnish radar composite from FMI S3 bucket, Transverse Mercator projection"
data_path = "https://s3-eu-west-1.amazonaws.com/fmi-opendata-radar-geotiff/2026/03/25/finrad/"
# Note: this bucket has ~300 files per day (5min interval). Loading all takes time.
# Consider using a time-limited prefix or filtering.
engine_type = "geotiff"
apis = ["edr"]

[collections.geotiff]
# Limit to 00:00-00:15 to avoid downloading hundreds of files
filename_pattern = '(?P<timestamp>2026032500[01]\d)_composite_cappi_600_dbzh_finrad_qc\.tif'
timestamp_format = "%Y%m%d%H%M"
parameter = "reflectivity"
unit = "dBZ"
poll_interval_secs = 300

[[collections]]
id = "opera-radar"
title = "OPERA European Radar Composite"
description = "1h accumulated precipitation from EUMETNET OPERA, LAEA projection (CloudFerro S3)"
data_path = "https://s3.waw3-1.cloudferro.com/openradar-24h/2026/03/25/OPERA/COMP/"
engine_type = "geotiff"
apis = ["edr"]

[collections.geotiff]
# Match only ACRR (accumulation) TIFF files, limit to 00:00-01:00 UTC
filename_pattern = 'OPERA@(?P<timestamp>\d{8}T0[01]\d{2})@0@ACRR\.tiff'
timestamp_format = "%Y%m%dT%H%M"
parameter = "precipitation"
unit = "mm"
poll_interval_secs = 300

# MET Norway radar cannot be listed via S3 (AccessDenied on list).
# Individual files are accessible but discovery requires STAC API (Phase 4).
# Use local files or the STAC catalog URL once implemented.
