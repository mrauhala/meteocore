# Runnable example for the Zarr engine (#125).
#
# This points at the committed synthetic fixture in this directory, so it works
# out of the box with no network access:
#
#   CONFIG_PATH=testdata/zarr-era5-t2m/test-config.toml cargo run -p server
#
# Then try. Values are served in display units (#1213): `t2m`, stored as
# 273.15 + 0.1*lat + 0.01*lon + 0.5*t K, reads 0.1*lat + 0.01*lon + 0.5*t °C;
# `msl` (Pa) reads in hPa and `mtpr` (kg m**-2 s**-1) in mm/h.
#
#   curl 'http://127.0.0.1:8097/edr/collections/era5-t2m'
#   curl 'http://127.0.0.1:8097/edr/collections/era5-t2m/position?coords=POINT(5.5%2054.5)'
#   # a rendered PNG map (Phase 3):
#   curl 'http://127.0.0.1:8097/maps/collections/era5-t2m/map?bbox=-0.5,48.5,15.5,60.5&width=256&height=192&crs=CRS:84&parameter-name=t2m' -o map.png
#
# Regenerate the fixture with:
#   cargo run -p engine-zarr --example gen_fixture

[server]
host = "127.0.0.1"
port = 8097

[[collections]]
id = "era5-t2m"
title = "ERA5-like Surface Fields (Zarr V3)"
description = "Synthetic CF-conventions Zarr V3 store: 2 m temperature, mean sea level pressure and precipitation rate over a small lat/lon window, served from a local directory."
engine_type = "zarr"
apis = ["edr", "wms", "maps", "tiles"]
keywords = ["temperature", "pressure", "precipitation", "reanalysis", "zarr"]

[collections.zarr]
# Local Zarr store root (relative to the working directory).
data_path = "testdata/zarr-era5-t2m"
zarr_version = 3
# Optional: expose only some variables. The fixture has `msl` (Pa), `mtpr`
# (kg m**-2 s**-1), `t2m` (float32) and `t2m_packed` (int16 with
# scale_factor/add_offset). Default = all.
# parameters = ["t2m"]
poll_interval_secs = 300

# One WMS/Maps/Tiles layer per variable, each on the built-in default for
# its name and served unit. The collection's own layer draws the first
# variable, `msl`, in hPa.
[collections.wms]
colormap = "pressure"

# ---------------------------------------------------------------------------
# Remote S3/HTTP backend (Phase 2, #125). A geographic (1-D lat/lon) Zarr on a
# public bucket is now runnable — give endpoint+bucket+path:
#
# [collections.zarr]
# endpoint = "https://s3.us-west-2.amazonaws.com"
# bucket = "mur-sst"
# path = "zarr-v1"
# parameters = ["analysed_sst"]
#
# (MUR-SST also trips the bad-chunking startup WARN by design — time=1,
# lat=full, lon=full — so a point time-series there decodes a full field per
# step. It's the issue's negative-test dataset.)
#
# HRRR-Zarr (s3://hrrrzarr/) is still NOT supported: it's on a Lambert Conformal
# projected grid with 2-D lat/lon (no 1-D geographic coordinate variables),
# which needs the projected/per-item-CRS work in Phase 4.
# ---------------------------------------------------------------------------
