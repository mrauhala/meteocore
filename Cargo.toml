[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engine-csv",
    "crates/engine-geojson",
    "crates/engine-geotiff",
    "crates/engine-postgis",
    "crates/engine-querydata",
    "crates/engine-grib",
    "crates/engine-nowcast",
    "crates/engine-odim",
    "crates/engine-cap",
    "crates/engine-zarr",
    "crates/storage",
    "crates/render",
    "crates/ds-cache",
    "crates/ds-mvt",
    "crates/ds-3dtiles",
    "crates/api-edr",
    "crates/api-features",
    "crates/api-wms",
    "crates/api-maps",
    "crates/api-tiles",
    "crates/api-3dtiles",
    "crates/server",
]
exclude = ["fuzz"]

# Per-crate `version` + `edition` are declared inline in each member's
# `[package]` block on purpose. We tried hoisting them to
# `[workspace.package]` (Rust's canonical inheritance shape) but
# `release-please-action`'s Rust updater can't parse
# `package.version.workspace = true` — it expects a literal string and
# fails the release-PR with `value at path package.version is not tagged`.
# Until that's fixed upstream, leaving versions inline lets release-please
# walk the workspace members and bump each one to the same value.

# Dev/test build-speed tuning. The dominant cost of `cargo test` here is not
# test execution (every binary finishes in <0.5s) but linking — writing and
# relocating full DWARF debug info across ~440 dependency crates and 17
# workspace members on every relink. The default dev profile uses `debug = 2`
# (full debuginfo); a one-line change cost ~14s to rebuild a test binary, of
# which only ~2.5s was actual compilation.
#
# - Workspace crates keep `line-tables-only`: panics/backtraces still resolve to
#   file:line, but the heavy variable/type DWARF is dropped.
# - Dependencies get no debuginfo at all (`package."*"`): you never step into
#   them, and their debug sections are the bulk of the link-time cost.
#
# This also speeds up CI (which builds the same dev/test profile). opt-level and
# codegen-units are left at their fast-compile defaults (0 / 256).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Interim patch (icechunk feature only). Tracked for removal in #340.
#
# `zarrs_icechunk`'s feature-forwarding fix (zarrs/zarrs_icechunk#13) shipped in
# 0.5.1 (2026-06-08), so that patch is gone — engine-zarr now depends on the
# published crate directly.
#
# `icechunk`'s one-line build fix (earth-mover/icechunk#2190: a bare `?` on a
# FromUtf8Error only convertible under the `s3`/aws-sdk feature, in
# virtual_chunks.rs) is merged upstream but NOT yet in a crates.io release (latest
# is 2.0.6, cut before the merge). Until icechunk releases > 2.0.6 with the fix,
# patch to the upstream merge commit so the `object-store-s3`-without-`s3` build
# compiles. Pinned to an immutable `rev` (not the branch) so a future
# `cargo update` can't silently follow a moved branch tip.
[patch.crates-io]
icechunk = { git = "https://github.com/earth-mover/icechunk.git", rev = "5f56b13605745ea06ec6558bcd8ed4a8f5805a3e" }
