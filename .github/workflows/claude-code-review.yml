name: Claude Code Review

# Jobs elevate only the permissions they need.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Cancel the previous review when a new commit lands on the same PR —
# only the latest commit's review matters, and review jobs can take
# several minutes to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip machine-generated PRs, which report a misleading red X rather
    # than anything actionable. A skipped job reports neutral instead.
    #
    # - Release PRs (branch `release-pr/main`, authored by
    #   github-actions[bot] — see release.yml): a version bump + changelog
    #   has nothing to review, and claude-code-action hard-fails on
    #   non-human actors anyway ("Workflow initiated by non-human actor").
    # - Dependabot PRs (#584): GitHub withholds repository secrets from the
    #   `dependabot` actor — they live in a separate secrets scope — so
    #   `secrets.CLAUDE_CODE_OAUTH_TOKEN` arrives EMPTY and the action dies
    #   on startup. Nothing in the workflow can fix that from this side, and
    #   a dependency bump is reviewed by the CI + audit gates regardless.
    if: >-
      github.event.pull_request.head.ref != 'release-pr/main' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the action can diff the PR against the base branch.
          fetch-depth: 0

      - name: Run Claude Code Review
        id: review
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1
        with:
          # A scoped workflow token avoids the App token service's default-
          # branch workflow-identity check (which skips reviews of workflow PRs).
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # In agent mode `--allowedTools` is the WHOLE allowlist — the
          # action adds nothing to it — and a headless run denies every
          # tool outside it. The previous list held only the four
          # commenting/diff tools, so the reviewer could not Read/Grep the
          # code it was reviewing: every run showed 10–30 permission
          # denials, finished in two turns, and usually posted nothing
          # (its verdict ended up as hidden text output). Grant the
          # read-only exploration tools plus read-only git/gh, the inline
          # comment MCP tool, and `gh pr comment` for the summary.
          claude_args: |
            --allowedTools "Read,Glob,Grep,LS,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review this pull request for correctness, security, and
            compliance with CLAUDE.md (root and the per-crate files it
            points to). Read the changed files and the code they touch,
            not just the diff. Add inline comments on specific problem
            lines, then ALWAYS post exactly one top-level PR comment via
            `gh pr comment`: either a concise summary of the findings, or
            "No issues found" with a one-line note of what you checked.
            A run that posts nothing is indistinguishable from a broken
            reviewer — never end without the top-level comment. Flag real
            issues only; do not nitpick style.
            Include this marker in the top-level summary comment:
            <!-- meteocore-review:${{ github.event.pull_request.head.sha }} -->
            REPO: ${{ github.repository }}
            PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Verify review execution and summary
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -s "$EXECUTION_FILE" ]; then
            echo "::error::Claude did not produce an execution record; the review did not run."
            exit 1
          fi
          marker="<!-- meteocore-review:${HEAD_SHA} -->"
          count=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" |
            jq -s --arg marker "$marker" '[.[][] | select(.user.type == "Bot" and (.body | contains($marker)))] | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::Claude ran but did not post the required summary for this commit."
            exit 1
          fi
