name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Cancel the previous review when a new commit lands on the same PR —
# only the latest commit's review matters, and review jobs can take
# several minutes to complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip machine-generated PRs, which report a misleading red X rather
    # than anything actionable. A skipped job reports neutral instead.
    #
    # - Release PRs (branch `release-pr/main`, authored by
    #   github-actions[bot] — see release.yml): a version bump + changelog
    #   has nothing to review, and claude-code-action hard-fails on
    #   non-human actors anyway ("Workflow initiated by non-human actor").
    # - Dependabot PRs (#584): GitHub withholds repository secrets from the
    #   `dependabot` actor — they live in a separate secrets scope — so
    #   `secrets.CLAUDE_CODE_OAUTH_TOKEN` arrives EMPTY and the action dies
    #   on startup. Nothing in the workflow can fix that from this side, and
    #   a dependency bump is reviewed by the CI + audit gates regardless.
    if: >-
      github.event.pull_request.head.ref != 'release-pr/main' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the action can diff the PR against the base branch.
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Explicitly allow the tools Claude needs to read the PR and
          # post findings. Without this, the action's default allowlist
          # does not include the commenting MCP tools on pull_request
          # events, and Claude hits a permission denial on its first
          # attempt to comment (run dies after ~4 turns / 6 seconds).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            Review this pull request for correctness, security, and
            compliance with CLAUDE.md. Post a concise top-level PR
            comment summarising findings, and add inline comments on
            specific problem lines. Flag real issues only — do not
            nitpick style.
            REPO: ${{ github.repository }}
            PR_NUMBER: ${{ github.event.pull_request.number }}
