name: CI

on:
  schedule:
    # Weekly on Sunday — pick up base image security patches
    - cron: '17 12 * * 0'
  push:
    branches: [ "main" ]
    # NB: no `tags:` here — versioned releases are owned by
    # `.github/workflows/release.yml`, and a tag it creates with
    # `GITHUB_TOKEN` does not fan-out to other workflows anyway.
  pull_request:
    branches: [ "main" ]

# Cancel stale runs when a newer commit lands on the same ref. PR review
# rounds force-push frequently; multiple merges to `main` queue up runs
# of which only the latest commit's result matters. `release.yml`
# deliberately does *not* set this — each tag is a distinct release
# artifact that must complete on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint & Test
    # Skip on scheduled runs — only Docker needs to rebuild weekly
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # `cmake` and `clang` are pre-installed on `ubuntu-24.04`
    # (the current `ubuntu-latest`), so no `apt-get` step is needed.
    # The previous step spent ~3 min mostly on `apt-get update` against
    # 30+ repo indexes for two packages that the runner image ships.

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    # `Swatinem/rust-cache` is the de-facto Rust cache action — faster
    # restore than `actions/cache`, GC's stale fingerprints/incremental
    # artifacts before save (keeps target/ small so we hit the cache
    # more often before the repo-wide 10 GiB limit evicts entries),
    # keys on Cargo.lock + rustc version + workspace members.
    - name: Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt -- --check

    - name: SQL safety check (engine-postgis)
      run: bash scripts/check_sql_safety.sh

    - name: Geo/XML safety check (web-mercator + WMS XML invariants)
      run: bash scripts/check_geo_safety.sh

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

    # `cargo test` builds everything `cargo build` does, plus test
    # binaries — a separate build step would just duplicate work.
    - name: Run tests
      run: cargo test

    # The Zarr engine's `icechunk` feature is off by default (heavy dep tree),
    # so the default jobs above don't compile it. Guard it from bitrot: lint +
    # run its network-free end-to-end test (#335).
    - name: Clippy + test engine-zarr icechunk feature
      run: |
        cargo clippy -p engine-zarr --features icechunk --all-targets -- -D warnings
        cargo test -p engine-zarr --features icechunk --test icechunk

  # RustSec advisory gate (#584). Deliberately a separate job from `check`:
  # it needs no compilation (it reads Cargo.lock), finishes in well under a
  # minute, and — unlike `check` — it also runs on the weekly `schedule`.
  # That schedule is the point of the gate: an advisory published against a
  # dependency we already ship turns CI red without anyone touching the code,
  # so the lockfile gets refreshed instead of quietly rotting.
  audit:
    name: Security Audit (RustSec)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Composite action (no Node runtime): fetches a prebuilt cargo-audit
      # binary in seconds rather than `cargo install`-ing it from source.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # `cargo audit` inspects Cargo.lock, not Cargo.toml. A lockfile that
      # disagrees with the manifests would make the gate below meaningless,
      # so fail loudly instead: `--locked` errors out rather than rewriting.
      - name: Verify Cargo.lock is in sync with the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

      # Policy lives in `.cargo/audit.toml` — deliberately NOT in flags here —
      # so a bare `cargo audit` run locally gives the identical verdict. It
      # sets `deny = ["warnings"]`, which fails on vulnerabilities *and* on
      # unmaintained/unsound/yanked crates, minus the ignores documented with
      # reachability analysis in that file.
      - name: cargo audit
        run: cargo audit

  docker-check:
    name: Docker Build (PR)
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # `load: true` puts the image in the local daemon so the boot gate
      # can actually exec it — a build alone cannot catch runtime-stage
      # breakage (glibc mismatch #582, missing .so, broken CMD).
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: meteocore-smoke:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot-smoke the image
        run: scripts/docker_boot_smoke.sh meteocore-smoke:pr

  docker:
    name: Docker
    needs: [check, audit]
    # Only push Docker on main, tags, and scheduled runs — skip on PRs.
    # `audit` is a hard gate on *publishing*: the weekly run exists to pick up
    # base-image security patches, so it must not republish `:main` while the
    # Rust dependency tree has a known advisory (#584).
    if: >-
      always() &&
      (needs.check.result == 'success' || github.event_name == 'schedule') &&
      needs.audit.result == 'success' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `:latest` is owned by release.yml (it points at the most recent
          # release tag). CI on main only publishes `:main` and
          # `:sha-…` development tags so consumers can pin to a specific
          # commit without colliding with the stable channel.
          flavor: |
            latest=false

      # Gate BEFORE publish: build into the local daemon and boot it.
      # The push step below reuses the buildx cache, so the double build
      # costs seconds — and a runtime-broken image never reaches ghcr
      # (the #582 glibc mismatch shipped precisely because nothing ever
      # exec'd the image between build and production).
      - name: Build image for boot smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: meteocore-smoke:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot-smoke the image
        run: scripts/docker_boot_smoke.sh meteocore-smoke:main

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
