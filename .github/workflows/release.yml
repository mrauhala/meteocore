# Release pipeline driven by git-cliff (https://git-cliff.org) + deterministic
# shell — see cliff.toml for the changelog/bump configuration and #220 for the
# migration rationale.
#
# Use Conventional Commit subject lines on PR merges into main:
#   feat: new …                  → minor bump, "Features" section
#   fix: stop crashing on …      → patch bump, "Bug Fixes"
#   perf: / revert: / deps:      → patch bump, their sections
#   feat!: breaking …            → minor while pre-1.0 (bump-minor-pre-major)
#   refactor:/docs:/chore:/test:/build:/ci:/style: → never trigger a release
#
# Two halves in one `release` job:
#   1. "Cut release from Cargo.toml": if crates/server/Cargo.toml names a
#      version with no v<version> tag, tag the commit that introduced that
#      version (a release-PR squash-merge — enforced by a subject-line
#      guard) and publish the matching CHANGELOG section as the GitHub
#      release. Idempotent (tag exists → no-op) and self-healing (any later
#      push to main cures a missed cut). This is the #489 design that ended
#      the v0.4.0–v0.7.0 missed-tag streak, ported verbatim except that the
#      version source moved from .release-please-manifest.json into
#      Cargo.toml itself.
#   2. "Propose release PR": git-cliff computes the bumped version and
#      renders the unreleased changelog section from ALL Conventional
#      Commits since the last tag — whatever paths they touch. If anything
#      is releasable, the job regenerates branch `release-pr/main` (version
#      bump in Cargo.toml + Cargo.lock, CHANGELOG section prepended) and
#      opens/updates a PR titled "chore: release X.Y.Z". Merging that PR is
#      what half 1 reacts to on the next push. Nothing releasable → no PR.
#
# Why not release-please (#220, evaluated 2026-08-18): it attributed commits
# strictly by paths under crates/server/, so a fix confined to another
# crate, the Dockerfile or CI never appeared in the notes — and could not
# even trigger the release that would ship it (the #582 hotfix class); its
# parser also silently dropped commits whose BODY it could not tokenize
# (nested parens — 28 entries hand-restored for v0.8.0). release-plz was
# evaluated and rejected: per-crate cargo-publish model, root-level files
# structurally invisible, spurious perpetual bumps with this workspace's
# de-synchronised member versions. git-cliff parses only the subject line
# and attributes repo-wide.
#
# Hand-edits to the release PR (polishing notes) survive only until the
# next push to main regenerates the branch — merge promptly. PRs opened
# with GITHUB_TOKEN do not trigger `pull_request` workflows (same
# limitation the release-please PRs had).
#
# Single workflow on purpose: a tag pushed by GITHUB_TOKEN does NOT
# trigger other workflows, so a separate `on: push tags` workflow would
# be silently dormant. Doing the whole pipeline here avoids needing a
# personal-access-token workaround.
#
# Manual re-fire: the `workflow_dispatch` trigger lets an operator
# (re-)build artifacts for an existing tag — useful when the release
# went through but build jobs were skipped due to a workflow bug. The
# resolve-target job picks the tag from the dispatch input or from
# the release job's output as appropriate.
#
# Security:
#   - No workflow-level `permissions:` — each job grants itself the
#     minimum it needs. A compromised action in `build-binary` cannot
#     request an OIDC token or push to ghcr.io.
#   - Every action in this file is pinned to a commit SHA so a
#     hijacked `vN` tag can't redirect us — including `actions/*`
#     (first-party GitHub) because any action in a job with `id-token:
#     write` or `contents: write` is a credential-exfil vector.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)build artifacts for (e.g. v0.2.0). Skips the release job.'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    # Skip on workflow_dispatch — that path explicitly targets an
    # existing tag and bypasses the release halves.
    if: github.event_name == 'push'
    # Serialise across overlapping pushes. Two runs racing on the shared
    # `release-pr/main` branch and the tag-cut check is a known way to
    # end up half-done. `cancel-in-progress: false` queues instead of
    # cancelling so a release in flight is never interrupted. Scoped to
    # this job only — the build/publish jobs operate on an immutable
    # tag, share no mutable state, and must not be made to queue behind
    # a release run (a workflow_dispatch artifact rebuild especially).
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.cut.outputs.created }}
      tag_name: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history + tags: git-cliff walks commits since the last
          # v-tag, and the cut step resolves version-introducing commits
          # and ancestor Cargo.toml contents locally.
          fetch-depth: 0

      # Direct pinned-checksum download, deliberately not an action:
      # every third-party action in a `contents: write` job is a
      # credential-exfil vector (see the header Security note).
      - name: Install git-cliff
        run: |
          set -euo pipefail
          curl -sSfL -o "${RUNNER_TEMP}/git-cliff.tar.gz" \
            https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz
          # Pinned to the checksum git-cliff itself publishes as the
          # `…x86_64-unknown-linux-gnu.tar.gz.sha512` release asset —
          # auditable by diffing against the upstream release page.
          echo "e716cce3a07dda41b1e370d6afbd7a59eb3d4739509fb7856aeec8da2be28c0396584e29e106141c1a1c535c1827dbc1f60417524f5cfb1da9e11f700bd00f30  ${RUNNER_TEMP}/git-cliff.tar.gz" | sha512sum -c -
          tar -xzf "${RUNNER_TEMP}/git-cliff.tar.gz" -C "${RUNNER_TEMP}"
          sudo install "${RUNNER_TEMP}/git-cliff-2.13.1/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      # Deterministic tag + GitHub release from committed repo state
      # alone: if crates/server/Cargo.toml's version has no v<version>
      # tag yet, tag the commit that introduced that version (the
      # squash-merge of the release PR) and publish the matching
      # CHANGELOG section as the release notes. No PR-body parsing, no
      # label state machine.
      #
      # Idempotent: tag already exists → clean no-op (every ordinary
      # push to main takes this path). Self-healing: if a release-merge
      # run ever fails before tagging, the next push to main cuts the
      # same release — the version still has no tag and the tag target
      # is looked up from history, not taken from HEAD. A real failure
      # here (API error, races) fails the job loudly.
      - name: Cut release from Cargo.toml
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Same single-version-line invariant the "Propose release PR"
          # step guards before editing — fail loudly on drift rather
          # than silently reading the wrong line into a tag name.
          if [ "$(grep -c '^version = "' crates/server/Cargo.toml)" != "1" ]; then
            echo "::error::Expected exactly one version line in crates/server/Cargo.toml"
            exit 1
          fi
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/server/Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::No literal version line in crates/server/Cargo.toml"
            exit 1
          fi
          tag="v${version}"
          # Remote check on purpose (the authoritative state a previous
          # run's API-created tag lives in). Branch on 404 specifically —
          # any other API failure (rate limit, 5xx) must fail loudly
          # here, not masquerade as "tag missing" and produce a
          # confusing error downstream.
          if out=$(gh api "repos/${REPO}/git/ref/tags/${tag}" 2>&1); then
            echo "Tag ${tag} already exists — nothing to cut."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q "HTTP 404" <<<"$out"; then
            echo "::error::Failed to check for tag ${tag}: ${out}"
            exit 1
          fi
          # The commit that INTRODUCED this version string is the
          # release-PR merge. Tag that commit, NOT HEAD — on a self-heal
          # run HEAD has already moved past the release commit. -S
          # pickaxe scoped to HEAD's history: while ${version} is
          # current and untagged, the most recent commit changing the
          # occurrence count of its version line is its introduction.
          release_sha=$(git log -1 --format=%H -S "version = \"${version}\"" -- crates/server/Cargo.toml)
          if [ -z "$release_sha" ]; then
            echo "::error::Could not resolve the commit that introduced ${version}."
            exit 1
          fi
          # Only a release-PR merge may introduce an untagged version.
          # Checked on the RESOLVED commit, not the triggering one —
          # self-healing runs are triggered by ordinary commits.
          # Anything else means Cargo.toml was edited by hand to a
          # version that was never released: fail loudly rather than
          # mint a public release from an accidental edit.
          subject=$(git log -1 --format=%s "$release_sha")
          if ! printf '%s' "$subject" | grep -qE '^chore(\(.+\))?: release '; then
            echo "::error::Cargo.toml names untagged ${version}, but the commit that set it ('${subject}', ${release_sha}) is not a release-PR merge. Fix the version or tag manually."
            exit 1
          fi
          # Backstop against stacked misses: if the version this one
          # replaced is ALSO untagged, an earlier release was never cut
          # (every push in between retried it and failed red — but a
          # green run here would bury it for good). Refuse to leapfrog;
          # recover the older release first, then re-run this workflow.
          prev_version=""
          if prev_toml=$(git show "${release_sha}^:crates/server/Cargo.toml" 2>/dev/null); then
            prev_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' <<<"$prev_toml" | head -n1)
          fi
          if [ -n "$prev_version" ] && [ "$prev_version" != "$version" ]; then
            if ! git rev-parse -q --verify "refs/tags/v${prev_version}" >/dev/null; then
              echo "::error::Previous version v${prev_version} is untagged — refusing to leapfrog a missed release. Recover v${prev_version}, then re-run this run:"
              echo "  1. sha=\$(git log -1 --format=%H -S 'version = \"${prev_version}\"' -- crates/server/Cargo.toml)"
              echo "  2. extract the ${prev_version} section of crates/server/CHANGELOG.md into notes.md"
              echo "  3. gh release create v${prev_version} --target \"\$sha\" --title v${prev_version} --notes-file notes.md"
              echo "  4. gh workflow run release.yml -f tag=v${prev_version}   # build + publish its artifacts"
              exit 1
            fi
          fi
          # Extract this version's CHANGELOG section (from "## [X.Y.Z]"
          # up to the next "## [" heading) as the release notes.
          # Substring match on "[X.Y.Z]" — no regex metacharacters from
          # the version can misfire.
          awk -v ver="$version" '
            /^## \[/ { in_section = index($0, "[" ver "]") > 0 }
            in_section { print }
          ' crates/server/CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if ! [ -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::warning::No CHANGELOG section found for ${version}; releasing without notes."
          fi
          gh release create "$tag" --target "$release_sha" --title "$tag" \
            --notes-file "${RUNNER_TEMP}/notes.md"
          echo "Created ${tag} at ${release_sha}."
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Cosmetic bookkeeping so the release PR reads as released in
          # the GitHub UI. The squash-merge subject ends in "(#N)".
          # Non-fatal: nothing downstream reads these labels.
          pr=$(printf '%s' "$subject" | grep -oE '\(#[0-9]+\)$' | tr -dc '0-9') || true
          if [ -n "${pr}" ]; then
            gh pr edit "$pr" --repo "$REPO" \
              --remove-label 'autorelease: pending' \
              --add-label 'autorelease: tagged' \
              || echo "::warning::Could not relabel release PR #${pr}."
          else
            echo "::warning::Could not find a PR number in '${subject}' — label not flipped."
          fi

      # Whole-repo release proposal (#220): git-cliff decides both
      # WHETHER to release (skipped types — refactor/docs/chore/test/
      # build/ci/style — are excluded from the bump, so a window of only
      # those proposes nothing) and WHAT (feat → minor, breaking → minor
      # while pre-1.0, everything else visible → patch). The branch is
      # regenerated from main on every push, so the PR always reflects
      # main's full unreleased window.
      - name: Propose release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A tag the cut step just created via the API is not in the
          # checkout — fetch so `--bumped-version` sees it.
          git fetch --force --tags -q origin
          # Bootstrap guard: this pipeline assumes at least one reachable
          # v-tag (true here since v0.2.0). On a fresh repo or after a tag
          # wipe, fail with instructions instead of git's opaque
          # "cannot describe anything" — minting a first version
          # automatically is not worth an untestable code path.
          if ! current_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>&1); then
            echo "::error::No v* tag reachable from HEAD (${current_tag}). Bootstrap manually: set crates/server/Cargo.toml's version, tag that commit v<version>, push the tag, then re-run."
            exit 1
          fi
          # Contract this step depends on (git-cliff 2.13.1, pinned in the
          # install step above): with no releasable commits since the last
          # tag, `--bumped-version` exits 0 and prints the CURRENT tag —
          # that is what makes the equality check below a clean no-op on
          # ordinary pushes. If a future git-cliff bump ever turns
          # "nothing to bump" into a non-zero exit, `set -e` fails this
          # step on every push to main — loud on purpose; re-verify the
          # contract when bumping the pin.
          next_tag=$(git-cliff --bumped-version)
          if [ "$next_tag" = "$current_tag" ]; then
            echo "No releasable commits since ${current_tag} — no release PR."
            exit 0
          fi
          next="${next_tag#v}"
          echo "Proposing ${current_tag} → ${next_tag}"
          # [package] version is the only line-anchored `version = "` in
          # crates/server/Cargo.toml (path deps carry no version reqs).
          # Guard the assumption instead of silently editing the wrong
          # line.
          if [ "$(grep -c '^version = "' crates/server/Cargo.toml)" != "1" ]; then
            echo "::error::Expected exactly one version line in crates/server/Cargo.toml"
            exit 1
          fi
          sed -i 's/^version = ".*"$/version = "'"${next}"'"/' crates/server/Cargo.toml
          # Cargo.lock's `server` entry must match or `cargo build
          # --locked` fails at the tag. Deterministic text edit — no
          # Rust toolchain in this job.
          perl -0pi -e 's/(\[\[package\]\]\nname = "server"\nversion = ")[^"]+/${1}'"${next}"'/' Cargo.lock
          if ! grep -A2 '^name = "server"$' Cargo.lock | grep -q "version = \"${next}\""; then
            echo "::error::Cargo.lock server entry was not updated"
            exit 1
          fi
          git-cliff --unreleased --tag "${next_tag}" --prepend crates/server/CHANGELOG.md
          git-cliff --unreleased --tag "${next_tag}" --strip all > "${RUNNER_TEMP}/pr-body.md"
          printf '\n---\nMerging this PR releases **%s**: the next push to main tags it, publishes the notes above, and builds the binaries + container image (.github/workflows/release.yml, #220).\n' "${next_tag}" >> "${RUNNER_TEMP}/pr-body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release-pr/main
          git add crates/server/Cargo.toml Cargo.lock crates/server/CHANGELOG.md
          git commit -m "chore: release ${next}"
          git push --force origin release-pr/main
          pr=$(gh pr list --head release-pr/main --state open --json number --jq '.[0].number' || true)
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then
            gh pr edit "$pr" --title "chore: release ${next}" --body-file "${RUNNER_TEMP}/pr-body.md"
          else
            gh pr create --head release-pr/main --base main \
              --title "chore: release ${next}" --body-file "${RUNNER_TEMP}/pr-body.md" \
              --label "autorelease: pending"
          fi

  # Resolve the tag for the build matrix from whichever entry path
  # fired this run. Centralising the resolution here means the build
  # jobs don't need to branch on `github.event_name`.
  resolve-target:
    needs: release
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
        needs.release.outputs.releases_created == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - id: r
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

  build-binary:
    name: binary ${{ matrix.target }}
    needs: resolve-target
    # `always() &&` is mandatory, not stylistic: on the
    # `workflow_dispatch` backfill path the `release` job is skipped,
    # and GitHub Actions propagates that skip *transitively* through
    # the dependency chain. Without `always()`, this job inherits the
    # original release-job skip even though its direct dep
    # (`resolve-target`) succeeded — and every build job sits out.
    if: always() && needs.resolve-target.result == 'success'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve-target.outputs.tag }}

      - name: Install system dependencies
        # cmake/clang are needed by `libaec-sys` (GRIB CCSDS support).
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libssl-dev

      # SHA-pinned for consistency with the other third-party actions
      # in this file. Same risk model — even though this job is
      # `contents: read` only, a hijacked `@stable` tag could still
      # inject backdoored Rust into the release tarball.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build release binary
        # `--locked` enforces that the lockfile committed at the tag
        # exactly matches Cargo.toml — so a release tag can't silently
        # pick up a new transitive dep version. This works because
        # the "Propose release PR" step rewrites `Cargo.lock`
        # alongside the `Cargo.toml` version bump in the release PR.
        # If a future release PR ever lands without a matching
        # `Cargo.lock` bump, this step fails loudly rather than
        # producing a release built against a drifted lockfile.
        env:
          TARGET: ${{ matrix.target }}
        # `--features icechunk`: ship Icechunk Zarr support in release binaries
        # (object_store S3 backend, ~+8 MB, no AWS SDK — #339). Reuses the
        # object_store/rustls stack already in the base build, so it adds no new
        # cross-compilation deps. Remove once the icechunk [patch] forks are
        # dropped if a leaner default is preferred (#340).
        run: cargo build --release --locked --target "${TARGET}" -p server --features icechunk

      - name: Package tarball
        # All inputs flow through `env:` so the shell never sees an
        # untrusted GitHub expression. `tag` comes from
        # `workflow_dispatch` input on the manual-backfill path, which
        # a write-access collaborator could otherwise abuse to run
        # arbitrary commands on the runner.
        env:
          VERSION: ${{ needs.resolve-target.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          base="meteocore-${VERSION}-${TARGET}"
          mkdir -p "dist/${base}"
          # Match the Docker image's binary name so the tarball and the
          # container ship the same `dataserver` symbol.
          cp "target/${TARGET}/release/server" "dist/${base}/dataserver"
          cp LICENSE* README.md "dist/${base}/" 2>/dev/null || true
          tar -czf "dist/${base}.tar.gz" -C dist "${base}"
          (cd dist && sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256")
          rm -rf "dist/${base}"
          ls -la dist/

      # Upload v7 + download v8 (in the `upload` job below) is the
      # intended pairing: both use the post-v4 artifact API; v8 is the
      # Node 24 successor of v7's download counterpart with no data-format
      # change. Same combination is in use upstream (fmidev/kubetin's
      # release.yml) and is the per-action floor in our CLAUDE.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: meteocore-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  build-container:
    name: container image
    needs: resolve-target
    # See build-binary above — `always()` defeats transitive skip
    # propagation from the dispatch-path-skipped `release` job.
    if: always() && needs.resolve-target.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.resolve-target.outputs.tag }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Strip the `v` prefix from the version tag so the image label
          # is `:1.2.3` not `:v1.2.3` (de-facto convention on most
          # registries). `:latest` flips to this release on every cut.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve-target.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-target.outputs.tag }}
            type=raw,value=latest

      # Gate BEFORE the multi-arch publish: build the native-arch image
      # into the local daemon and boot it (scripts/docker_boot_smoke.sh).
      # The push below reuses the buildx cache for the amd64 half. A
      # runtime-broken image (the #582 glibc mismatch class) must never
      # take the `:latest` / version tags.
      - name: Build image for boot smoke (linux/amd64)
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: meteocore-smoke:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot-smoke the image
        run: scripts/docker_boot_smoke.sh meteocore-smoke:release

      - name: Build and push (linux/amd64, linux/arm64)
        id: build-and-push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with cosign
        # Sigstore signatures are attached to a manifest digest, not a tag
        # name — so one call per digest is enough. Signing per-tag would
        # just create three identical Rekor entries for the same digest.
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

  upload:
    name: attach binaries to release
    # No dependency on build-container: image publish is a peer operation
    # against ghcr.io. If the container build fails, the binaries on the
    # GitHub Release are still useful and should ship.
    needs: [resolve-target, build-binary]
    # See build-binary above — `always()` defeats transitive skip
    # propagation from the dispatch-path-skipped `release` job.
    if: always() && needs.resolve-target.result == 'success' && needs.build-binary.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          tag_name: ${{ needs.resolve-target.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
