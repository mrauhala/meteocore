# Release pipeline driven by release-please (https://github.com/googleapis/release-please).
#
# Use Conventional Commit subject lines on PR merges into main:
#   feat: new …
#   fix: stop crashing on …
#   chore: bump dependencies
#   feat!: breaking …            # or include `BREAKING CHANGE:` in the body
#
# release-please watches commits to main and opens a PR titled
# "chore: release main" with the bumped version + CHANGELOG. Merging
# that PR bumps `.release-please-manifest.json` on main; the
# "Cut release from manifest" step below then creates the git tag and
# GitHub Release, which gates the build + publish jobs.
#
# Division of labour (deliberate, see #220): release-please ONLY
# manages the release PR (`skip-github-release: true`). It is NOT
# trusted to cut the tag/release. Its release pass re-parses the
# merged PR and requires the PR head branch's component to match the
# configured `component` ("PR component: undefined does not match
# configured component" in strategies/base.ts). A grouped manifest PR
# lives on `release-please--branches--main` — no component in the
# branch name — so with `component: meteocore` configured that match
# can never succeed, and the tag was silently skipped on EVERY release
# since the cargo-workspace merge plugin landed in #168: v0.4.0,
# v0.5.0, v0.6.0 and v0.7.0 all had to be cut by hand. The PR half has
# never failed, so it stays; the tagging half is deterministic shell
# on repo state alone (manifest version + CHANGELOG), which is also
# self-healing: any push to main cures a previously missed release.
#
# Single workflow on purpose: a tag pushed by GITHUB_TOKEN does NOT
# trigger other workflows, so a separate `on: push tags` workflow would
# be silently dormant. Doing the whole pipeline here avoids needing a
# personal-access-token workaround.
#
# Manual re-fire: the `workflow_dispatch` trigger lets an operator
# (re-)build artifacts for an existing tag — useful when the release
# went through but build jobs were skipped due to a workflow bug. The
# resolve-target job picks the tag from the dispatch input or from
# release-please's output as appropriate.
#
# Security:
#   - No workflow-level `permissions:` — each job grants itself the
#     minimum it needs. A compromised action in `build-binary` cannot
#     request an OIDC token or push to ghcr.io.
#   - Every action in this file is pinned to a commit SHA so a
#     hijacked `vN` tag can't redirect us — including `actions/*`
#     (first-party GitHub) because any action in a job with `id-token:
#     write` or `contents: write` is a credential-exfil vector.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)build artifacts for (e.g. v0.2.0). Skips release-please.'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    # Skip on workflow_dispatch — that path explicitly targets an
    # existing tag and bypasses release-please.
    if: github.event_name == 'push'
    # Serialise release-please across overlapping pushes. Two runs racing
    # on the shared `release-please--branches--main` branch and the
    # `autorelease:*` labels is a known way to leave release-please
    # half-done. `cancel-in-progress: false` queues instead of cancelling
    # so a release in flight is never interrupted. Scoped to this job
    # only — the build/publish jobs operate on an immutable tag, share no
    # mutable state, and must not be made to queue behind a release run
    # (a workflow_dispatch artifact rebuild especially).
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.cut.outputs.created }}
      tag_name: ${{ steps.cut.outputs.tag }}
    steps:
      # PR management only — `skip-github-release` keeps release-please
      # away from tags/releases so it can never race (or silently skip)
      # the deterministic cut step below. See the header comment for why.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Deterministic tag + GitHub release from committed repo state
      # alone: if `.release-please-manifest.json`'s version has no
      # v<version> tag yet, tag the commit that last changed the
      # manifest (the squash-merge of the release PR) and publish the
      # matching CHANGELOG section as the release notes. No PR-body
      # parsing, no component matching, no label state machine.
      #
      # Idempotent: tag already exists → clean no-op (every ordinary
      # push to main takes this path). Self-healing: if a release-merge
      # run ever fails before tagging, the next push to main cuts the
      # same release — the manifest still names an untagged version and
      # the tag target is looked up from the manifest's history, not
      # taken from HEAD. This step replaces the old "guard" that only
      # alarmed on a missed release (#216); a real failure here (API
      # error, races) fails the job loudly instead.
      - name: Cut release from manifest
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(jq -r '."crates/server"' .release-please-manifest.json)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::No crates/server version in .release-please-manifest.json"
            exit 1
          fi
          tag="v${version}"
          if gh api "repos/${REPO}/git/ref/tags/${tag}" --silent 2>/dev/null; then
            echo "Tag ${tag} already exists — nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The commit that introduced this manifest version is the
          # release-PR merge. Tag that commit, NOT ${HEAD_SHA} — on a
          # self-heal run HEAD has already moved past the release
          # commit. Scoped to HEAD's history so a rerun of an old run
          # can't pick a newer release commit than its own HEAD.
          release_sha=$(gh api \
            "repos/${REPO}/commits?path=.release-please-manifest.json&sha=${HEAD_SHA}&per_page=1" \
            --jq '.[0].sha')
          if [ -z "$release_sha" ]; then
            echo "::error::Could not resolve the commit that last changed the manifest."
            exit 1
          fi
          # Extract this version's CHANGELOG section (from "## [X.Y.Z]"
          # up to the next "## [" heading) as the release notes.
          # Substring match on "[X.Y.Z]" — no regex metacharacters from
          # the version can misfire.
          awk -v ver="$version" '
            /^## \[/ { in_section = index($0, "[" ver "]") > 0 }
            in_section { print }
          ' crates/server/CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if ! [ -s "${RUNNER_TEMP}/notes.md" ]; then
            echo "::warning::No CHANGELOG section found for ${version}; releasing without notes."
          fi
          gh release create "$tag" --target "$release_sha" --title "$tag" \
            --notes-file "${RUNNER_TEMP}/notes.md"
          echo "Created ${tag} at ${release_sha}."
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Cosmetic bookkeeping so the release PR reads as released in
          # the GitHub UI. The squash-merge subject ends in "(#N)".
          # Non-fatal: nothing downstream reads these labels now that
          # release-please's release pass is skipped.
          subject=$(gh api "repos/${REPO}/commits/${release_sha}" \
            --jq '.commit.message' | head -n1)
          pr=$(printf '%s' "$subject" | grep -oE '\(#[0-9]+\)$' | tr -dc '0-9') || true
          if [ -n "${pr}" ]; then
            gh pr edit "$pr" --repo "$REPO" \
              --remove-label 'autorelease: pending' \
              --add-label 'autorelease: tagged' \
              || echo "::warning::Could not relabel release PR #${pr}."
          else
            echo "::warning::Could not find a PR number in '${subject}' — label not flipped."
          fi

  # Resolve the tag for the build matrix from whichever entry path
  # fired this run. Centralising the resolution here means the build
  # jobs don't need to branch on `github.event_name`.
  resolve-target:
    needs: release-please
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.releases_created == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - id: r
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

  build-binary:
    name: binary ${{ matrix.target }}
    needs: resolve-target
    # `always() &&` is mandatory, not stylistic: on the
    # `workflow_dispatch` backfill path `release-please` is skipped,
    # and GitHub Actions propagates that skip *transitively* through
    # the dependency chain. Without `always()`, this job inherits the
    # original release-please skip even though its direct dep
    # (`resolve-target`) succeeded — and every build job sits out.
    if: always() && needs.resolve-target.result == 'success'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.resolve-target.outputs.tag }}

      - name: Install system dependencies
        # cmake/clang are needed by `libaec-sys` (GRIB CCSDS support).
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libssl-dev

      # SHA-pinned for consistency with the other third-party actions
      # in this file. Same risk model — even though this job is
      # `contents: read` only, a hijacked `@stable` tag could still
      # inject backdoored Rust into the release tarball.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build release binary
        # `--locked` enforces that the lockfile committed at the tag
        # exactly matches Cargo.toml — so a release tag can't silently
        # pick up a new transitive dep version. This works because
        # release-please's `cargo-workspace` plugin rewrites
        # `Cargo.lock` alongside the `Cargo.toml` version bump in the
        # release PR (see `release-please-config.json::plugins`).
        # If a future release PR ever lands without a matching
        # `Cargo.lock` bump, this step fails loudly rather than
        # producing a release built against a drifted lockfile.
        env:
          TARGET: ${{ matrix.target }}
        # `--features icechunk`: ship Icechunk Zarr support in release binaries
        # (object_store S3 backend, ~+8 MB, no AWS SDK — #339). Reuses the
        # object_store/rustls stack already in the base build, so it adds no new
        # cross-compilation deps. Remove once the icechunk [patch] forks are
        # dropped if a leaner default is preferred (#340).
        run: cargo build --release --locked --target "${TARGET}" -p server --features icechunk

      - name: Package tarball
        # All inputs flow through `env:` so the shell never sees an
        # untrusted GitHub expression. `tag` comes from
        # `workflow_dispatch` input on the manual-backfill path, which
        # a write-access collaborator could otherwise abuse to run
        # arbitrary commands on the runner.
        env:
          VERSION: ${{ needs.resolve-target.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          base="meteocore-${VERSION}-${TARGET}"
          mkdir -p "dist/${base}"
          # Match the Docker image's binary name so the tarball and the
          # container ship the same `dataserver` symbol.
          cp "target/${TARGET}/release/server" "dist/${base}/dataserver"
          cp LICENSE* README.md "dist/${base}/" 2>/dev/null || true
          tar -czf "dist/${base}.tar.gz" -C dist "${base}"
          (cd dist && sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256")
          rm -rf "dist/${base}"
          ls -la dist/

      # Upload v7 + download v8 (in the `upload` job below) is the
      # intended pairing: both use the post-v4 artifact API; v8 is the
      # Node 24 successor of v7's download counterpart with no data-format
      # change. Same combination is in use upstream (fmidev/kubetin's
      # release.yml) and is the per-action floor in our CLAUDE.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: meteocore-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  build-container:
    name: container image
    needs: resolve-target
    # See build-binary above — `always()` defeats transitive skip
    # propagation from the dispatch-path-skipped `release-please` job.
    if: always() && needs.resolve-target.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.resolve-target.outputs.tag }}

      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003  # v4.1.1

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Strip the `v` prefix from the version tag so the image label
          # is `:1.2.3` not `:v1.2.3` (de-facto convention on most
          # registries). `:latest` flips to this release on every cut.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve-target.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-target.outputs.tag }}
            type=raw,value=latest

      - name: Build and push (linux/amd64, linux/arm64)
        id: build-and-push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with cosign
        # Sigstore signatures are attached to a manifest digest, not a tag
        # name — so one call per digest is enough. Signing per-tag would
        # just create three identical Rekor entries for the same digest.
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

  upload:
    name: attach binaries to release
    # No dependency on build-container: image publish is a peer operation
    # against ghcr.io. If the container build fails, the binaries on the
    # GitHub Release are still useful and should ship.
    needs: [resolve-target, build-binary]
    # See build-binary above — `always()` defeats transitive skip
    # propagation from the dispatch-path-skipped `release-please` job.
    if: always() && needs.resolve-target.result == 'success' && needs.build-binary.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
        with:
          tag_name: ${{ needs.resolve-target.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
