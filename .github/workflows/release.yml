# Release pipeline driven by release-please (https://github.com/googleapis/release-please).
#
# Use Conventional Commit subject lines on PR merges into main:
#   feat: new …
#   fix: stop crashing on …
#   chore: bump dependencies
#   feat!: breaking …            # or include `BREAKING CHANGE:` in the body
#
# release-please watches commits to main and opens a PR titled
# "chore(main): release X.Y.Z" with the bumped [workspace.package]
# version + CHANGELOG. Merging that PR creates the git tag and GitHub
# Release, which gates the build + publish jobs below.
#
# Single workflow on purpose: a tag pushed by GITHUB_TOKEN does NOT
# trigger other workflows, so a separate `on: push tags` workflow would
# be silently dormant. Doing the whole pipeline here avoids needing a
# personal-access-token workaround.
#
# Manual re-fire: the `workflow_dispatch` trigger lets an operator
# (re-)build artifacts for an existing tag — useful when the release
# went through but build jobs were skipped due to a workflow bug. The
# resolve-target job picks the tag from the dispatch input or from
# release-please's output as appropriate.
#
# Security:
#   - No workflow-level `permissions:` — each job grants itself the
#     minimum it needs. A compromised action in `build-binary` cannot
#     request an OIDC token or push to ghcr.io.
#   - Every action in this file is pinned to a commit SHA so a
#     hijacked `vN` tag can't redirect us — including `actions/*`
#     (first-party GitHub) because any action in a job with `id-token:
#     write` or `contents: write` is a credential-exfil vector.

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)build artifacts for (e.g. v0.2.0). Skips release-please.'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    # Skip on workflow_dispatch — that path explicitly targets an
    # existing tag and bypasses release-please.
    if: github.event_name == 'push'
    # Serialise release-please across overlapping pushes. Two runs racing
    # on the shared `release-please--branches--main` branch and the
    # `autorelease:*` labels is a known way to leave release-please
    # half-done. `cancel-in-progress: false` queues instead of cancelling
    # so a release in flight is never interrupted. Scoped to this job
    # only — the build/publish jobs operate on an immutable tag, share no
    # mutable state, and must not be made to queue behind a release run
    # (a workflow_dispatch artifact rebuild especially).
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # release-please-action v5 with a `packages` config (monorepo
      # mode) emits flat-keyed outputs prefixed by the package path.
      # The bare `release_created` / `tag_name` / `version` we
      # previously read were empty in this mode, which silently
      # skipped every downstream build job for the v0.2.0 release.
      # `releases_created` (note the plural) is the cross-package
      # "any release was made" flag and is the safe gate for the
      # downstream jobs; per-package values are read by path key.
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs['crates/server--tag_name'] }}
      version: ${{ steps.release.outputs['crates/server--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Loud guard against the silent failure that stranded v0.4.0: a
      # release PR ("chore: release …") was merged, but release-please did
      # not cut the tag/GitHub release, so `releases_created` is false and
      # every downstream build job silently skips. Without this step the
      # miss is invisible — the job still reports success — and is only
      # noticed days later.
      - name: Guard against a missed release
        if: steps.release.outputs.releases_created != 'true'
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          subject="$(printf '%s\n' "$HEAD_MSG" | head -n1)"
          # Release PRs are squash-merged, so the merge commit subject is
          # the PR title ("chore: release …"). A standard (non-squash)
          # merge would read "Merge pull request …" and not match — that
          # is acceptable: this repo squash-merges throughout.
          if ! printf '%s' "$subject" | grep -qE '^chore(\(.+\))?: release '; then
            echo "Not a release-PR merge — nothing to guard."
            exit 0
          fi
          # A release PR merged but release-please reported no release.
          # That is only a real miss if the commit is also untagged: after
          # a manual recovery (or a release-please retry on a later run) a
          # v* tag points at this commit, so re-running the workflow must
          # not false-positive.
          if gh api --paginate "repos/${REPO}/git/refs/tags" \
              --jq '.[].object.sha' | grep -qx "${HEAD_SHA}"; then
            echo "A tag already points at this release commit — release exists. OK."
            exit 0
          fi
          echo "::error::Release PR merged ('$subject') but release-please created no release and this commit is untagged."
          echo "Recovery runbook:"
          echo "  1. version=\$(jq -r '.\"crates/server\"' .release-please-manifest.json)"
          echo "  2. gh release create \"v\$version\" --target ${HEAD_SHA} --notes-file <changelog section>"
          echo "  3. gh pr edit <release-pr#> --remove-label 'autorelease: pending' --add-label 'autorelease: tagged'"
          echo "  4. gh workflow run release.yml -f tag=\"v\$version\"   # build + publish artifacts"
          echo "  5. push any commit to main — that advances HEAD past the release commit so"
          echo "     release-please opens the next release PR (re-running this run would not,"
          echo "     since it stays on the release commit)."
          exit 1

  # Resolve the tag for the build matrix from whichever entry path
  # fired this run. Centralising the resolution here means the build
  # jobs don't need to branch on `github.event_name`.
  resolve-target:
    needs: release-please
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.releases_created == 'true')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - id: r
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

  build-binary:
    name: binary ${{ matrix.target }}
    needs: resolve-target
    # `always() &&` is mandatory, not stylistic: on the
    # `workflow_dispatch` backfill path `release-please` is skipped,
    # and GitHub Actions propagates that skip *transitively* through
    # the dependency chain. Without `always()`, this job inherits the
    # original release-please skip even though its direct dep
    # (`resolve-target`) succeeded — and every build job sits out.
    if: always() && needs.resolve-target.result == 'success'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.resolve-target.outputs.tag }}

      - name: Install system dependencies
        # cmake/clang are needed by `libaec-sys` (GRIB CCSDS support).
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libssl-dev

      # SHA-pinned for consistency with the other third-party actions
      # in this file. Same risk model — even though this job is
      # `contents: read` only, a hijacked `@stable` tag could still
      # inject backdoored Rust into the release tarball.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build release binary
        # `--locked` enforces that the lockfile committed at the tag
        # exactly matches Cargo.toml — so a release tag can't silently
        # pick up a new transitive dep version. This works because
        # release-please's `cargo-workspace` plugin rewrites
        # `Cargo.lock` alongside the `Cargo.toml` version bump in the
        # release PR (see `release-please-config.json::plugins`).
        # If a future release PR ever lands without a matching
        # `Cargo.lock` bump, this step fails loudly rather than
        # producing a release built against a drifted lockfile.
        env:
          TARGET: ${{ matrix.target }}
        # `--features icechunk`: ship Icechunk Zarr support in release binaries
        # (object_store S3 backend, ~+8 MB, no AWS SDK — #339). Reuses the
        # object_store/rustls stack already in the base build, so it adds no new
        # cross-compilation deps. Remove once the icechunk [patch] forks are
        # dropped if a leaner default is preferred (#340).
        run: cargo build --release --locked --target "${TARGET}" -p server --features icechunk

      - name: Package tarball
        # All inputs flow through `env:` so the shell never sees an
        # untrusted GitHub expression. `tag` comes from
        # `workflow_dispatch` input on the manual-backfill path, which
        # a write-access collaborator could otherwise abuse to run
        # arbitrary commands on the runner.
        env:
          VERSION: ${{ needs.resolve-target.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          base="meteocore-${VERSION}-${TARGET}"
          mkdir -p "dist/${base}"
          # Match the Docker image's binary name so the tarball and the
          # container ship the same `dataserver` symbol.
          cp "target/${TARGET}/release/server" "dist/${base}/dataserver"
          cp LICENSE* README.md "dist/${base}/" 2>/dev/null || true
          tar -czf "dist/${base}.tar.gz" -C dist "${base}"
          (cd dist && sha256sum "${base}.tar.gz" > "${base}.tar.gz.sha256")
          rm -rf "dist/${base}"
          ls -la dist/

      # Upload v7 + download v8 (in the `upload` job below) is the
      # intended pairing: both use the post-v4 artifact API; v8 is the
      # Node 24 successor of v7's download counterpart with no data-format
      # change. Same combination is in use upstream (fmidev/kubetin's
      # release.yml) and is the per-action floor in our CLAUDE.md.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: meteocore-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  build-container:
    name: container image
    needs: resolve-target
    # See build-binary above — `always()` defeats transitive skip
    # propagation from the dispatch-path-skipped `release-please` job.
    if: always() && needs.resolve-target.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          ref: ${{ needs.resolve-target.outputs.tag }}

      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003  # v4.1.1

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Strip the `v` prefix from the version tag so the image label
          # is `:1.2.3` not `:v1.2.3` (de-facto convention on most
          # registries). `:latest` flips to this release on every cut.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.resolve-target.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-target.outputs.tag }}
            type=raw,value=latest

      - name: Build and push (linux/amd64, linux/arm64)
        id: build-and-push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image with cosign
        # Sigstore signatures are attached to a manifest digest, not a tag
        # name — so one call per digest is enough. Signing per-tag would
        # just create three identical Rekor entries for the same digest.
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

  upload:
    name: attach binaries to release
    # No dependency on build-container: image publish is a peer operation
    # against ghcr.io. If the container build fails, the binaries on the
    # GitHub Release are still useful and should ship.
    needs: [resolve-target, build-binary]
    # See build-binary above — `always()` defeats transitive skip
    # propagation from the dispatch-path-skipped `release-please` job.
    if: always() && needs.resolve-target.result == 'success' && needs.build-binary.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          ls -la

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
        with:
          tag_name: ${{ needs.resolve-target.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
