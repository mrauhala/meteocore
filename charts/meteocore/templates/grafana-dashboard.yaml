{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "meteocore.fullname" . }}-dashboard
  namespace: {{ .Values.grafanaDashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "meteocore.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # The repository's docker/grafana/dashboards/meteocore-overview.json, a symlink
  # in the chart's dashboards/ directory that packaging resolves. Compacted: a
  # ConfigMap holds at most 1 MiB, and the indented file is most of that.
  meteocore-overview.json: {{ .Files.Get "dashboards/meteocore-overview.json" | fromJson | toJson | toJson }}
{{- end }}
